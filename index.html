<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loup de mer</title>
<style>
:root{--ink:#04192b;--foam:#eafcff;--aqua:#5fe0e6;--panel:rgba(6,36,44,.82);--line:rgba(170,240,255,.25)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#123f45,#030f12 75%);color:var(--foam);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1000px;height:560px;flex:none}
#cv{position:absolute;inset:0;width:1000px;height:560px;border-radius:16px;box-shadow:0 0 0 4px #10343b,0 0 0 8px #071c21,0 0 0 9px #2b6f73,0 30px 80px rgba(0,0,0,.55)}
.screen{position:absolute;inset:0;border-radius:16px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,rgba(6,40,50,.62),rgba(3,20,26,.9))}
.screen.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1.title{font-size:54px;letter-spacing:5px;font-weight:900;color:#fff;text-shadow:0 3px 0 #1590ad,0 6px 0 #0a5470,0 12px 30px rgba(0,0,0,.4)}
h1.title span{display:inline-block;animation:bob 2.6s ease-in-out infinite}
h1.title small{font-size:26px;letter-spacing:2px;color:var(--aqua);margin:0 6px}
@keyframes bob{50%{transform:translateY(-6px)}}
.menuRow{display:flex;gap:16px;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 22px;display:grid;grid-template-columns:auto auto;gap:12px 18px;align-items:center;align-content:start}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:3px;color:var(--aqua);text-align:right}
.choices{display:flex;gap:7px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:none}
.choices button{min-width:60px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--foam);font-weight:700;font-size:15px;border:2px solid transparent;transition:.15s}
.choices button:hover:not(:disabled){background:rgba(255,255,255,.18)}
.choices button.sel,.choices button.sel:hover{background:var(--aqua);color:var(--ink);border-color:#c9fbff}
.choices button:disabled{opacity:.3;cursor:default}
.choices.sens{align-items:center;gap:10px}
.choices.sens .lo{font-size:12px;opacity:.6;font-weight:700}
.choices.sens b{min-width:34px;text-align:center;padding:6px 0;border-radius:999px;background:var(--aqua);color:var(--ink);font-size:15px}
#sens{-webkit-appearance:none;appearance:none;width:190px;height:8px;border-radius:99px;background:linear-gradient(90deg,rgba(255,255,255,.15),var(--aqua));outline:none;cursor:pointer}
#sens::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#c9fbff;border:3px solid var(--ink);cursor:pointer}
#sens::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#c9fbff;border:3px solid var(--ink);cursor:pointer}
.desc{grid-column:1/3;font-size:12.5px;line-height:1.45;opacity:.85;max-width:420px}
.mapPick{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mapPick canvas{width:300px;height:300px;border-radius:10px;cursor:pointer;display:block}
.mapLbl{font-size:12px;opacity:.85;letter-spacing:.5px}
.big{padding:11px 32px;border-radius:999px;background:linear-gradient(180deg,#8ff3f3,#38c3d4);color:var(--ink);font-weight:900;font-size:19px;letter-spacing:1px;box-shadow:0 5px 0 #13788c,0 10px 24px rgba(0,0,0,.3);transition:.12s}
.big:hover:not(:disabled){transform:translateY(-2px)}
.big:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #13788c}
.big:disabled{filter:grayscale(.8) brightness(.7);cursor:default}
.ghost{padding:10px 22px;border-radius:999px;background:transparent;color:var(--foam);border:2px solid var(--line);font-weight:700;font-size:16px}
.ghost:hover{background:rgba(255,255,255,.08)}
.row{display:flex;gap:14px;align-items:center}
.hint{font-size:12px;opacity:.65;letter-spacing:.5px}
h2.head{font-size:32px;font-weight:900;letter-spacing:1px;text-shadow:0 4px 0 #0a5470}
.cards{display:flex;gap:12px}
.card{width:190px;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:7px}
.card .nm{font-weight:900;font-size:17px;color:var(--c)}
.card .role{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.8;margin-top:-4px}
.card canvas{width:64px;height:56px}
.card canvas.hop{animation:hop .35s ease}
@keyframes hop{40%{transform:translateY(-12px)}}
.keys{display:flex;gap:6px}
.kc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;opacity:.9;text-transform:uppercase;letter-spacing:1px}
.key{width:40px;height:40px;border-radius:9px;background:#e9f7fb;color:#0a2a40;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #86aebb;transition:transform .05s}
.key.on{transform:translateY(3px);box-shadow:0 1px 0 #86aebb;background:var(--c)}
.rules{font-size:13px;max-width:760px;text-align:center;line-height:1.45;opacity:.95}
.rules b{color:#ff8a7b}
.load{width:340px;height:9px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.load i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fe0e6,#c9fbff);border-radius:99px}
.loadtxt{font-size:12px;opacity:.8;letter-spacing:1px;margin-top:-4px}
.ranks{display:flex;flex-direction:column;gap:8px;min-width:480px}
.rk{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:9px 14px;font-size:16px}
.rk b{width:24px;font-size:20px}
.rk .n{flex:1;font-weight:800;color:var(--c)}
.rk .t{opacity:.85;font-size:14px}
.rk .tag{font-size:10.5px;background:#ff4b4b;color:#fff;border-radius:99px;padding:3px 8px;font-weight:800;letter-spacing:1px}
.pauseBtn{position:absolute;right:12px;bottom:10px;width:38px;height:38px;border-radius:50%;background:rgba(8,22,30,.7);color:#fff;font-weight:900;font-size:14px;display:none;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.35);z-index:5;letter-spacing:-1px}
.pauseBtn:hover{background:rgba(8,22,30,.9)}
.tour{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13px}
.tour .lbl{opacity:.8;letter-spacing:1px;text-transform:uppercase;font-size:11px}
.tour .tp{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:5px 10px;font-weight:800;color:var(--c)}
.tour .st{color:#ffd60a;letter-spacing:2px}.tour .st i{color:rgba(255,255,255,.25);font-style:normal}
.podium{display:flex;align-items:flex-end;gap:14px;height:190px;margin-top:4px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;width:150px}
.pod canvas{width:60px;height:52px}
.pod .nm{font-weight:900;font-size:16px;color:var(--c)}
.pod .wn{font-size:12px;opacity:.85}
.pod .blk{width:100%;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,var(--c),rgba(0,0,0,.35));display:flex;align-items:flex-start;justify-content:center;font-size:34px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35);padding-top:6px;border:2px solid rgba(255,255,255,.25)}
.ranks.small{min-width:420px}.ranks.small .rk{padding:5px 12px;font-size:14px}
.sub2{font-size:15px;opacity:.85;margin-top:-6px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>

  <div class="screen on" id="scrMenu">
    <h1 class="title" id="title"></h1>
    <div class="menuRow">
      <div class="panel">
        <h2>Mode</h2>
        <div class="choices" id="chMode"><button data-v="loup" class="sel">Loup</button><button data-v="epervier">Épervier</button><button data-v="drapeau">Drapeau</button><button data-v="parcours">Parcours</button><button data-v="zone">Zone</button></div>
        <h2>Joueurs</h2>
        <div class="choices" id="chPlayers"><button data-v="2" class="sel">2</button><button data-v="3">3</button><button data-v="4">4</button></div>
        <h2 id="lblTime">Durée</h2>
        <div class="choices" id="chTime"><button data-v="60">1 min</button><button data-v="120" class="sel">2 min</button><button data-v="180">3 min</button><button data-v="240">4 min</button><button data-v="300">5 min</button></div>
        <h2>Format</h2>
        <div class="choices" id="chFormat"><button data-v="single" class="sel">Partie</button><button data-v="tournament">Tournoi</button></div>
        <h2 id="lblBest">Manches</h2>
        <div class="choices" id="chBest"><button data-v="3" class="sel">3</button><button data-v="5">5</button><button data-v="7">7</button></div>
        <h2>Sensibilité</h2>
        <div class="choices sens"><span class="lo">1</span><input type="range" id="sens" min="1" max="10" step="1" value="5"><span class="lo">10</span><b id="sensVal">5</b></div>
        <h2>Touches J2</h2>
        <div class="choices" id="chKeys"><button data-v="azerty" class="sel">Q Z D (AZERTY)</button><button data-v="qwerty">A W D (QWERTY)</button></div>
        <p class="desc" id="modeDesc"></p>
      </div>
      <div class="mapPick">
        <canvas id="mapCv" width="600" height="600"></canvas>
        <div class="mapLbl" id="mapLbl"></div>
      </div>
    </div>
    <button class="big" id="btnNext">Suivant ›</button>
  </div>

  <div class="screen" id="scrPrep">
    <h2 class="head" id="prepTitle">Préparez-vous !</h2>
    <div class="cards" id="cards"></div>
    <p class="rules" id="rules"></p>
    <div class="load"><i id="loadBar"></i></div>
    <div class="loadtxt" id="loadTxt">…</div>
    <div class="row"><button class="ghost" id="btnBack">‹ Retour</button><button class="big" id="btnStart" disabled>Lancer la partie</button></div>
  </div>

  <button class="pauseBtn" id="btnPause" title="Pause (Échap)">❚❚</button>

  <div class="screen" id="scrPause">
    <h2 class="head">Pause</h2>
    <div class="row"><button class="ghost" id="btnQuit">Menu</button><button class="big" id="btnResume">Reprendre</button></div>
    <p class="hint">Échap pour reprendre</p>
  </div>

  <div class="screen" id="scrPodium">
    <h2 class="head" id="podTitle">Podium</h2>
    <p class="sub2" id="podSub"></p>
    <div class="podium" id="podium"></div>
    <div class="ranks small" id="podRanks"></div>
    <div class="row"><button class="ghost" id="btnPodMenu">Menu</button><button class="big" id="btnPodAgain">Nouveau tournoi</button></div>
  </div>

  <div class="screen" id="scrEnd">
    <h2 class="head" id="winner">Fin !</h2>
    <p class="sub2" id="endSub"></p>
    <div class="ranks" id="ranks"></div>
    <div class="tour" id="tourBox"></div>
    <div class="row"><button class="ghost" id="btnMenu">Menu</button><button class="big" id="btnAgain">Rejouer</button></div>
    <p class="hint">Entrée pour rejouer</p>
  </div>
</div></div>
<script>
(() => {
'use strict';

/* =========================================================
   CONSTANTES COMMUNES
   Toutes les cartes sont construites sur la même grille : 1 unité = 100 px.
   Les plateformes sont posées sur les lignes d'unité, et deux étages
   successifs sont toujours séparés d'une unité. Un saut monte de 1,35 unité.
   ========================================================= */
const VW = 1000, VH = 560;
const U = 100, LV = U;
const GRAV_UP = 2300, GRAV_DOWN = 1550, JUMP_H = 115, JUMP_V = Math.sqrt(2 * GRAV_UP * JUMP_H), GRAV = GRAV_UP;
const RUN = 250, MAX_FALL = 820;
// sensibilité (curseur 1 à 10 dans le menu) : 10 = réponse immédiate, 1 = beaucoup d'inertie
function handlingFor(v) {
  const k = (clamp(+v || 5, 1, 10) - 1) / 9, ga = 800 * Math.pow(7, k);
  return { ga, gd: ga * 1.15, aa: ga * 0.62, ad: ga * 0.34, run: 0.9 + 0.1 * k };
}
const STEP = 1 / 120, COYOTE = 0.09, BUFFER = 0.13;
const STEP_UP = 16, SNAP_DOWN = 8, LEDGE = 14, CORNER = 11, EPS = 0.01;
const PW = 26, PH = 28;
const Z_MAX = 1.0;
const FONT = '"Trebuchet MS","Segoe UI",system-ui,sans-serif';
const PORTAL_R = 14, PEARL_TRAVEL = 0.8;
const bounceV = h => Math.sqrt(2 * GRAV_UP * h);

const PLAYER_DEFS = [
  { id: 1, name: 'Joueur 1', color: '#ff453a', dark: '#9e1a12', keys: { left: 'ArrowLeft', jump: 'ArrowUp', right: 'ArrowRight' }, labels: ['←', '↑', '→'] },
  { id: 2, name: 'Joueur 2', color: '#ffd60a', dark: '#93760a', keys: { left: 'KeyA', jump: 'KeyW', right: 'KeyD' }, labels: ['Q', 'Z', 'D'] },
  { id: 3, name: 'Joueur 3', color: '#a46bff', dark: '#552aa8', keys: { left: 'KeyJ', jump: 'KeyI', right: 'KeyL' }, labels: ['J', 'I', 'L'] },
  { id: 4, name: 'Joueur 4', color: '#f4f4f4', dark: '#6f6f6f', keys: { left: 'KeyF', jump: 'KeyT', right: 'KeyH' }, labels: ['F', 'T', 'H'] },
];

/* ---------- outils ---------- */
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(c, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
const fmtFloor = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const fmtCeil = t => { t = Math.max(0, Math.ceil(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const slopeY = (sl, x) => sl.y1 + (x - sl.x1) * (sl.y2 - sl.y1) / (sl.x2 - sl.x1);
function poly(g, pts) { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }

/* ---------- état global ---------- */
const cv = $('cv'), ctx = cv.getContext('2d', { alpha: false }), stage = $('stage');
let RES = 0, T = 0, G = null, current = 'scrMenu';
const settings = { mode: 'loup', players: 2, duration: 120, map: 'epave', format: 'single', bestOf: 3, sens: 5, epRound: 30 };
const held = {};
const cam = { x: 0, y: 0, z: 1 };

/* =========================================================
   PHYSIQUE
   Types de solides :
   plat (plateforme), wall (trait vertical : bloque mais on ne peut pas
   marcher dessus), bounce (tremplin), launch (propulseur horizontal),
   trap (trappe), gate (porte), oneway (hachuré : traversable par dessous)
   ========================================================= */
const hitR = (x, y, s) => x < s.x + s.w - EPS && x + PW > s.x + EPS && y < s.y + s.h - EPS && y + PH > s.y + EPS;
function blocks(p, s) {
  if (s.off) return false;
  switch (s.kind) {
    case 'plat': case 'wall': case 'bounce': case 'launch': return true;
    case 'trap': return !G.trapOpen;
    case 'gate': return s.on(p);
    case 'oneway': return !!(s.solidFor && s.solidFor.has(p));
  }
  return false;
}
function stands(p, s) {
  if (s.off) return false;
  switch (s.kind) {
    case 'plat': case 'bounce': case 'launch': return true;
    case 'trap': return !G.trapOpen;
    case 'oneway': return !!(s.solidFor && s.solidFor.has(p));
  }
  return false;
}
/* pentes (diagonales praticables) : bande d'épaisseur sl.t sous la ligne
   (x1,y1)-(x2,y2). On marche dessus ; par en dessous et par les côtés
   elles sont aussi solides qu'une plateforme. */
const slClamp = (sl, x) => slopeY(sl, clamp(x, sl.x1, sl.x2));
function slOver(sl, x, y) {
  const xa = Math.max(x, sl.x1), xb = Math.min(x + PW, sl.x2);
  if (xb - xa < 0.5) return null;
  const sa = slopeY(sl, xa), sb = slopeY(sl, xb);
  const lo = Math.min(sa, sb), hi = Math.max(sa, sb) + sl.t;
  return (y < hi - EPS && y + PH > lo + EPS) ? { lo, hi } : null;
}
// la pente bloque si le joueur la chevauche alors que ses pieds sont sous la surface
function slBlocks(sl, x, y) { return !sl.oneway && !!slOver(sl, x, y) && y + PH > slClamp(sl, x + PW / 2) + 2; }
/* murs obliques et carré tournant : polygones convexes (séparation des axes) */
function polyPen(verts, x, y) {
  const box = [[x, y], [x + PW, y], [x + PW, y + PH], [x, y + PH]];
  const axes = [[1, 0], [0, 1]];
  for (let i = 0; i < verts.length; i++) { const a = verts[i], b = verts[(i + 1) % verts.length], ex = b[0] - a[0], ey = b[1] - a[1], l = Math.hypot(ex, ey); axes.push([-ey / l, ex / l]); }
  let best = Infinity, bax = null;
  for (const ax of axes) {
    let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
    for (const [px, py] of box) { const d = px * ax[0] + py * ax[1]; if (d < a0) a0 = d; if (d > a1) a1 = d; }
    for (const [px, py] of verts) { const d = px * ax[0] + py * ax[1]; if (d < b0) b0 = d; if (d > b1) b1 = d; }
    const o = Math.min(a1, b1) - Math.max(a0, b0);
    if (o <= 0.01) return null;
    if (o < best) { best = o; bax = ax; }
  }
  return { d: best, ax: bax };
}
function free(p, x, y) {
  if (x < 0 || x + PW > G.map.W || y < 0) return false;
  for (const s of G.solids) if (blocks(p, s) && hitR(x, y, s)) return false;
  for (const sl of G.map.slopes) if (slBlocks(sl, x, y)) return false;
  for (const w of G.map.polys) if (polyPen(w.verts, x, y)) return false;
  return true;
}
function surfaceAt(p, up, down) {
  const feet = p.y + PH, cx = p.x + PW / 2;
  let best = null, by = Infinity;
  for (const s of G.solids) {
    if (!stands(p, s)) continue;
    if (p.x + PW > s.x + EPS && p.x < s.x + s.w - EPS && s.y >= feet - up - EPS && s.y <= feet + down + EPS && s.y < by) { by = s.y; best = { s }; }
  }
  for (const sl of G.map.slopes) {
    if (p.x + PW < sl.x1 + 1 || p.x > sl.x2 - 1) continue;
    const y = slClamp(sl, cx);
    if (y >= feet - up - EPS && y <= feet + down + EPS && y < by) { by = y; best = { sl }; }
  }
  return best ? { y: by, g: best } : null;
}
function moveX(p, dx) {
  if (!dx) return;
  const ox = p.x;
  p.x = clamp(p.x + dx, 0, G.map.W - PW);
  if (p.x === ox) return;
  for (const s of G.solids) {
    if (!blocks(p, s) || !hitR(p.x, p.y, s)) continue;
    const lift = p.y + PH - s.y;
    const vert = s.kind === 'wall' || s.kind === 'gate';
    const maxLift = vert ? -1 : (p.onGround ? STEP_UP : (p.vy > -60 ? LEDGE : -1));
    if (lift > 0 && lift <= maxLift && free(p, p.x, s.y - PH)) { p.y = s.y - PH; if (!p.onGround) { p.onGround = true; p.vy = 0; } p.ground = { s }; continue; }
    p.x = (p.x + PW / 2 < s.x + s.w / 2) ? s.x - PW : s.x + s.w;
    p.launchT = 0;
  }
  for (const sl of G.map.slopes) {
    if (!slBlocks(sl, p.x, p.y)) continue;
    const top = slClamp(sl, p.x + PW / 2), lift = p.y + PH - top;
    const maxLift = p.onGround ? STEP_UP : (p.vy >= 0 ? LEDGE : 0);
    if (lift > 0 && lift <= maxLift && free(p, p.x, top - PH)) { p.y = top - PH; p.onGround = true; p.vy = Math.max(0, p.vy); p.ground = { sl }; continue; }
    p.x = ox; p.launchT = 0; return;
  }
  for (const w of G.map.polys) if (polyPen(w.verts, p.x, p.y)) { p.x = ox; p.launchT = 0; return; }
}
function moveY(p, dy) {
  const prevTop = p.y, prevBot = p.y + PH;

      c.beginPath(); c.moveTo(x - 6 * d, y); c.lineTo(x - 12 * d, y - 3.5); c.lineTo(x - 12 * d, y + 3.5); c.closePath(); c.fill();
    }
  }
}
let flagRGB = [235, 230, 215];
function drawFlagCloth(c, x, y, w = 62, h = 40) {
  const target = G && G.wolfColor ? hexRgb(G.wolfColor) : [235, 230, 215];
  for (let i = 0; i < 3; i++) flagRGB[i] += (target[i] - flagRGB[i]) * 0.08;
  const col = `rgb(${flagRGB.map(Math.round).join(',')})`;
  c.beginPath(); c.moveTo(x, y);
  for (let i = 1; i <= 10; i++) { const t = i / 10; c.lineTo(x + t * w, y + t * 3 + Math.sin(T * 4 - t * 5) * 5 * t); }
  for (let i = 10; i >= 0; i--) { const t = i / 10; c.lineTo(x + t * w - (i % 3 === 0 && i > 3 ? 6 : 0), y + h - t * 2 + Math.sin(T * 4 - t * 5) * 5 * t); }
  c.closePath(); c.fillStyle = col; c.fill(); c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1.2; c.stroke();
}

    const gg = g.createLinearGradient(0, L(0), 0, m.H); gg.addColorStop(0, '#5c8a4a'); gg.addColorStop(1, '#3d5f34');
    g.fillStyle = gg; g.fillRect(0, L(0), m.W, m.H - L(0));
    g.strokeStyle = '#2f4a28'; g.lineWidth = 1.5; for (let x = 6; x < m.W; x += 9) { g.beginPath(); g.moveTo(x, L(0) + 2); g.lineTo(x + (rnd() - .5) * 3, L(0) - 8 - rnd() * 6); g.stroke(); }
    g.fillStyle = 'rgba(255,255,255,.3)'; g.fillRect(0, L(0), m.W, 2);
    paintSolids(g, m, rnd);
    // nid
    g.strokeStyle = '#6d4a3e'; g.lineWidth = 4; g.beginPath(); g.moveTo(5.75 * U, L(3)); g.quadraticCurveTo(6.15 * U, L(3) - 40, 6.55 * U, L(3)); g.stroke();
    g.strokeStyle = '#8a6a5e'; g.lineWidth = 2; for (let i = 0; i < 5; i++) { g.beginPath(); g.moveTo(5.79 * U + i * 2, L(3) - 3); g.quadraticCurveTo(6.15 * U, L(3) - 34 + i * 4, 6.51 * U - i * 2, L(3) - 3); g.stroke(); }
  };
  m.dynBack = () => {}; m.dynFront = () => {};
  return m;
}

/* =========================================================
   4. DRAPEAU (14 × 9,4 unités)
   ========================================================= */
function mapDrapeau() {
  const m = newMap({ id: 'drapeau', name: 'Le Château', skin: 'knight', W: 14 * U, H: 9.4 * U, FLOOR: 9 * U, edge: '#000' });
  const L = m.L;
  P(m, 0, 14, 0, 'steel', { h: 0.4 * U });
  // ---------- en haut à gauche ----------
  Wv(m, 0.75, 6, 8, 'steelwall', 'L'); P(m, 0.75, 1.5, 8, 'steel'); P(m, 0.75, 2.75, 6, 'steel');   // crochet
  P(m, 3, 4.75, 7, 'steel');                                                                          // étagère
  addS(m, oscMover({ x: 1.5 * U, y: L(8), w: 1.25 * U, h: TH, kind: 'plat', mat: 'hazard', dyn: true }, 2.5 * U, 0, 6));   // plateforme mobile ↔
  P(m, 0, 3.75, 5, 'steel'); S(m, 3.75, 5, 4.05, 4.7, 'steel', 10);                                // longue plateforme + petit biseau
  P(m, 1.5, 4.75, 4, 'steel');                                                                        // plateforme du milieu gauche
  P(m, 4.25, 5.25, 6, 'steel'); S(m, 5.25, 6, 6.5, 5, 'steel');                                     // au-dessus : plateforme + diagonale
  // ---------- en haut à droite ----------
  P(m, 8.25, 10.5, 8, 'steel'); S(m, 10.5, 8, 12.25, 7, 'steel');                                   // plateforme + diagonale
  P(m, 9.75, 10.75, 7, 'steel');                                                                      // petite plateforme sous la diagonale
  // créneaux (plateformes avec merlons) à l'étage 6
  P(m, 8.5, 9.4, 6, 'steel'); P(m, 8.75, 9.25, 6.4, 'steel', { h: 0.4 * U });
  P(m, 10, 11.65, 6, 'steel'); P(m, 10.5, 11, 6.4, 'steel', { h: 0.4 * U });
  P(m, 8.25, 12.5, 5, 'steel');                                                                       // longue plateforme de droite
  P(m, 11.5, 14, 4, 'steel');                                                                         // reçoit le mur qui tombe
  // ---------- centre ----------
  P(m, 5.5, 8, 4, 'steel');                                                                           // plateforme du drapeau
  // ---------- en bas à gauche ----------
  P(m, 0, 1, 1, 'steel');                                                                             // petite plateforme du bas
  addS(m, oscMover({ x: 0, y: L(2), w: 1.0 * U, h: TH, kind: 'plat', mat: 'hazard', dyn: true }, 0, -2 * U, 6));   // plateforme mobile ↕ (L2 ↔ L4)
  P(m, 1.25, 2, 2, 'steel');                                                                          // petite plateforme (buisson)
  P(m, 2.25, 4.25, 3, 'steel'); Wv(m, 4.25, 2.6, 3.5, 'steelwall', 'R');                             // longue plateforme et son poteau
  S(m, 2, 1, 4.25, 2, 'steel');                                                                       // diagonale du bas (le long de l'arche)
  // ---------- en bas au centre et à droite ----------
  P(m, 5.25, 8.5, 2, 'steel'); S(m, 7, 2.5, 7.5, 3, 'steel');                                       // plateforme basse ; la diagonale s'arrête au-dessus (on passe dessous)
  P(m, 7.5, 10.75, 3, 'steel'); Wv(m, 10.75, 1, 3, 'steelwall', 'R');
  P(m, 8, 10, 1, 'steel');
  Wv(m, 11.25, 1, 3, 'steelwall', 'L'); P(m, 11.25, 12.5, 3, 'steel'); P(m, 11.25, 13.25, 1, 'steel'); P(m, 12.25, 13.75, 2, 'steel');   // crochet de droite (fermé en bas)
  addS(m, { x: 4.25 * U, y: L(0) - 16, w: 0.75 * U, h: 16, kind: 'bounce', mat: 'spring', power: 3.6 * U, dyn: true });   // tremplin
  addS(m, thwompMover({ x: 12.55 * U, y: 6, w: 0.8 * U, h: 0.75 * U, kind: 'plat', mat: 'thwomp', dyn: true }, L(4)));     // mur qui tombe
  m.rot = { cx: 7 * U, cy: L(7), half: 0.8 * U, w: 0.5, ang: Math.PI / 4 };
  m.flagBase = { x: 7 * U, y: L(4) };
  m.paintFar = g => {
    const gr = g.createLinearGradient(0, 0, 0, m.H); gr.addColorStop(0, '#8fc4ee'); gr.addColorStop(1, '#e6f3fb');
    g.fillStyle = gr; g.fillRect(0, 0, m.W, m.H);
  };
  m.paintBack = g => {
    g.fillStyle = '#d9d2c4'; g.fillRect(0, 0, m.W, m.H);
    g.fillStyle = '#cbc3b3';
    for (let y = 0; y < m.H; y += 34) for (let x = (y / 34) % 2 ? 0 : 34; x < m.W; x += 68) g.fillRect(x, y, 66, 32);
    // fenêtres en arc et bannières (décor)
    for (const x of [2.2, 6.0, 8.0, 11.8]) { g.fillStyle = '#7fb4dc'; g.beginPath(); g.moveTo(x * U - 26, L(0.6)); g.lineTo(x * U - 26, L(1.6)); g.arc(x * U, L(1.6), 26, Math.PI, 0); g.lineTo(x * U + 26, L(0.6)); g.closePath(); g.fill(); g.strokeStyle = '#8b8170'; g.lineWidth = 4; g.stroke(); }
    for (const x of [2.0, 12.0]) { g.fillStyle = '#8b4d4d'; g.fillRect(x * U - 30, L(8.6), 60, 1.4 * U); g.beginPath(); g.moveTo(x * U - 30, L(7.2)); g.lineTo(x * U, L(6.9)); g.lineTo(x * U + 30, L(7.2)); g.closePath(); g.fill(); g.fillStyle = '#e0b040'; g.beginPath(); g.arc(x * U, L(7.9), 12, 0, Math.PI * 2); g.fill(); }
    g.strokeStyle = 'rgba(90,80,65,.35)'; g.lineWidth = 3; g.beginPath(); g.arc(3.5 * U, L(1.2), 1.4 * U, Math.PI * 1.05, Math.PI * 1.75); g.stroke();
    fogOver(g, 'rgba(240,236,228,.35)', m);
  };
  m.paintFore = g => { paintSolids(g, m, mulberry32(4)); };
  m.dynBack = () => {}; m.dynFront = () => {};
  return m;
}

/* =========================================================

   ========================================================= */
function mapParcours() {
  const m = newMap({ id: 'parcours', name: 'La Maison', skin: 'mouse', W: 16 * U, H: 9.4 * U, FLOOR: 9 * U, edge: '#000' });
  const L = m.L;
  P(m, 0, 9.37, 0, 'floorwood', { h: 0.4 * U }); P(m, 9.37, 16, 0, 'floorwood', { h: 0.4 * U });
  // ===== à gauche (le départ) =====
  P(m, 0, 3.25, 1, 'shelf');                                 // souris au départ (buisson)
  P(m, 2.5, 5, 2, 'shelf');                                  // buisson
  P(m, 0.25, 2.5, 4, 'shelf'); S(m, 2.5, 4, 3.5, 3, 'shelf');   // plateforme + diagonale qui descend
  S(m, 2.5, 5, 3.4, 5.55, 'shelf'); S(m, 3.65, 4.7, 4.55, 5.3, 'shelf');   // deux diagonales sous la plateforme du buisson
  S(m, 5.12, 5, 6.5, 6, 'shelf');                            // troisième diagonale, au-dessus du mur
  P(m, 1, 4, 6, 'shelf');                                    // plateforme du buisson
  addS(m, { x: 0, y: L(7), w: 0.6 * U, h: 14, kind: 'launch', mat: 'spring', vx: 1550, vy: 430, time: 0.6, dyn: true });   // propulseur
  Wv(m, 5, 1, 7.2, 'wallwood', 'L');                         // le grand mur : sépare la gauche du reste
  addS(m, { x: 5 * U, y: L(1), w: WT, h: U, kind: 'gate', mat: 'door', dyn: true, on: () => !G.trapOpen });   // seul passage, tout en bas : s'ouvre avec le levier
  // ===== au milieu =====
  P(m, 5.12, 7.5, 4, 'shelf');
  addS(m, { x: 6.5 * U, y: L(5), w: 2.75 * U, h: TH, kind: 'trap', mat: 'bridge', dyn: true });   // passerelle : tombe quand on tire le levier
  P(m, 6, 9.75, 3, 'shelf');                                 // couloir du levier : plafond (buisson)
  P(m, 6.5, 9.25, 2, 'shelf');                               // couloir du levier : sol
  S(m, 5.12, 2, 6.25, 1, 'shelf'); P(m, 6.25, 8.25, 1, 'shelf');
  S(m, 5.5, 0.7, 6.25, 0, 'shelf');                          // petites diagonales du bas
  Wv(m, 9.37, 0, 2, 'wallwood', 'R');
  // ===== la salle des pics =====
  Wo(m, 8.75, 6, 10.12, 3.5, 'wallwood', 16); Wo(m, 9.37, 2, 10.4, 3, 'wallwood', 16);
  P(m, 9.75, 10.5, 3, 'shelf'); Wv(m, 10.24, 3, 4, 'wallwood', 'R');   // mur : pas de passage sous la salle des pics
  P(m, 8.75, 10.75, 6, 'shelf');                             // plateforme du haut (buisson, point de retour)
  Wv(m, 10.75, 6, 8, 'wallwood', 'R'); P(m, 10.75, 11.75, 8, 'shelf');   // mur + plateforme tout en haut (buisson)
  P(m, 8.75, 10, 7, 'shelf'); P(m, 8.5, 9.75, 8, 'shelf');              // deux petites plateformes
  P(m, 9.75, 11, 4, 'shelf'); addS(m, { x: 11 * U, y: L(4), w: 0.75 * U, h: TH, kind: 'trap', mat: 'trap', dyn: true }); P(m, 11.75, 13.36, 4, 'shelf');
  m.hazards.push({ x: 9.75 * U + 6, y: L(4) - 18, w: 1.25 * U - 6, h: 18, type: 'spikes' }, { x: 11.75 * U, y: L(4) - 18, w: 1.61 * U, h: 18, type: 'spikes' });
  P(m, 10.5, 12.5, 3, 'shelf');                              // sous la trappe
  // ===== en bas à droite =====
  P(m, 10.5, 12.25, 1, 'shelf');                             // buisson
  Wv(m, 10.5, 0, 0.5, 'wallwood', 'L'); Wv(m, 11.25, 0.25, 1, 'wallwood', 'L'); Wv(m, 12.25, 0, 0.5, 'wallwood', 'R');
  S(m, 12.25, 1, 13.5, 2, 'shelf'); P(m, 13.5, 14.5, 2, 'shelf'); Wv(m, 14.5, 1, 2, 'wallwood', 'R');
  P(m, 14.5, 15, 1, 'shelf'); P(m, 15.25, 16, 2, 'shelf');
  S(m, 12.75, 0, 14, 1, 'shelf');
  // ===== la colonne de droite =====
  Wv(m, 13.5, 2.4, 9, 'wallwood', 'R');                        // on n'y entre que par en dessous (après la trappe)
  P(m, 14.25, 16, 3, 'shelf');                               // buisson
  addS(m, { x: 13.5 * U, y: L(4), w: 2.5 * U, h: TH, kind: 'oneway', mat: 'hatched', dyn: true, solidFor: new Set() });
  addS(m, { x: 13.5 * U, y: L(5), w: 2.5 * U, h: TH, kind: 'oneway', mat: 'hatched', dyn: true, solidFor: new Set() });
  P(m, 15, 15.75, 6, 'shelf');                               // buisson
  P(m, 14, 15.5, 7, 'shelf'); Wv(m, 14.25, 6, 7, 'wallwood', 'L'); P(m, 13.5, 14.25, 6, 'shelf');   // en haut (buisson) ; niche de la perle
  addS(m, thwompMover({ x: 14.6 * U, y: 6, w: 0.8 * U, h: 0.6 * U, kind: 'wall', mat: 'weight', dyn: true }, L(7)));
  m.balls = [0, 1, 2].map(i => ({ x: 9.6 * U + i * 1.2 * U, y: L(5.5), r: 15, v: (i % 2 ? -1 : 1) * 120, col: ['#e2574c', '#4f8fd6', '#e8b93c'][i], x0: 9.2 * U, x1: 13.36 * U }));
  m.lever = { x: 9.05 * U, y: L(2), on: false };
  m.goal = { x: 13.9 * U, y: L(6) };
  m.start = { x: 1.6 * U, y: L(1) };
  m.respawn = { x: 9.3 * U, y: L(6) };
  m.catSpawn = { x: 0.7 * U, y: L(0) };
  m.hide.push(
    { x1: 0.25 * U, x2: 1.0 * U, y: L(1), type: 'bush' }, { x1: 4.0 * U, x2: 4.75 * U, y: L(2), type: 'bush' }, { x1: 2.6 * U, x2: 3.5 * U, y: L(6), type: 'bush' },
    { x1: 6.9 * U, x2: 7.6 * U, y: L(3), type: 'bush' }, { x1: 7.3 * U, x2: 7.9 * U, y: L(0), type: 'bush' }, { x1: 9.6 * U, x2: 10.3 * U, y: L(6), type: 'bush' },
    { x1: 10.95 * U, x2: 11.6 * U, y: L(8), type: 'bush' }, { x1: 10.8 * U, x2: 11.6 * U, y: L(1), type: 'bush' }, { x1: 14.7 * U, x2: 15.5 * U, y: L(0), type: 'bush' },
    { x1: 14.8 * U, x2: 15.5 * U, y: L(3), type: 'bush' }, { x1: 14.6 * U, x2: 15.4 * U, y: L(5), type: 'bush' }, { x1: 15.05 * U, x2: 15.6 * U, y: L(6), type: 'bush' }, { x1: 14.9 * U, x2: 15.4 * U, y: L(7), type: 'bush' });
  m.paintFar = g => {
    g.fillStyle = '#ecdcbc'; g.fillRect(0, 0, m.W, m.H);
    g.fillStyle = 'rgba(205,175,125,.32)'; for (let x = 0; x < m.W; x += 50) g.fillRect(x, 0, 18, m.H);
    g.fillStyle = 'rgba(150,110,70,.25)'; g.fillRect(0, L(3.6), m.W, 8);

  m.paintBack = g => {
    g.fillStyle = '#3b4f78'; rr(g, 6.0 * U, L(8.4), 2.4 * U, 1.7 * U, 8); g.fill(); g.fillStyle = '#f5e7b0'; g.beginPath(); g.arc(7.8 * U, L(8), 16, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#7a5434'; g.lineWidth = 10; rr(g, 6.0 * U, L(8.4), 2.4 * U, 1.7 * U, 8); g.stroke(); g.lineWidth = 5; g.beginPath(); g.moveTo(7.2 * U, L(8.4)); g.lineTo(7.2 * U, L(6.7)); g.moveTo(6 * U, L(7.55)); g.lineTo(8.4 * U, L(7.55)); g.stroke();
    for (const [x, k, w, h] of [[1.2, 8.5, 90, 70], [3.6, 3.7, 70, 56], [12.3, 6.6, 70, 90]]) { g.fillStyle = '#9b7a55'; g.fillRect(x * U - 6, L(k) - 6, w + 12, h + 12); g.fillStyle = '#c9b78d'; g.fillRect(x * U, L(k), w, h); }
    // la rampe noire du croquis : simple décor d'escalier en fond
    g.strokeStyle = 'rgba(110,80,55,.35)'; g.lineWidth = 6; g.beginPath(); g.moveTo(5.15 * U, L(0)); g.lineTo(9.0 * U, L(1.9)); g.stroke();
    g.lineWidth = 2; for (let i = 1; i < 10; i++) { const t = i / 10; g.beginPath(); g.moveTo(lerp(5.15, 9, t) * U, lerp(L(0), L(1.9), t)); g.lineTo(lerp(5.15, 9, t) * U, L(0)); g.stroke(); }
    g.fillStyle = '#7a3f3f'; g.fillRect(11.0 * U, L(0) - 8, 3 * U, 8);
    fogOver(g, 'rgba(236,220,188,.35)', m);
  };
  m.paintFore = g => {
    paintSolids(g, m, mulberry32(6));
    for (const h of m.hazards) drawSpikes(g, h);
  };
  m.dynBack = () => {}; m.dynFront = c => drawHide(c, m);
  return m;
}


/* =========================================================
   6. ZONE — LE VOLCAN (26 × 15 unités, trois fois plus grand)
   Nouveautés : geysers (courants ascendants qui s'allument et
   s'éteignent), roche ponce qui s'effrite sous les pieds, coulées
   (tapis roulants de lave refroidie) ; plus les blocs de basalte
   qui tombent et les perles.
   ========================================================= */
function mapZone() {
  const m = newMap({ id: 'zone', name: 'Le Volcan', skin: 'kid', W: 26 * U, H: 15 * U, FLOOR: 14.4 * U, edge: '#000' });
  const L = m.L, Wd = 26;
  P(m, 0, Wd, 0, 'basalt', { h: 0.6 * U });
  // symétrie gauche / droite autour du centre (x = 13)
  const both = (x1, x2, k, kind, conv) => {
    for (const [a, b, dir] of [[x1, x2, 1], [Wd - x2, Wd - x1, -1]]) {
      if (kind === 'crumble') addS(m, { x: a * U, y: L(k), w: (b - a) * U, h: TH, kind: 'plat', mat: 'pumice', crumble: true, dyn: true });
      else if (kind === 'conv') addS(m, { x: a * U, y: L(k), w: (b - a) * U, h: TH, kind: 'plat', mat: 'flow', conv: conv * dir, dyn: true });
      else P(m, a, b, k, 'basalt', { h: 20 });
    }
  };
  both(1, 3, 1); both(9.5, 11.5, 1, 'conv', 110);          // coulées du bas : vers le centre
  both(3.3, 5, 2); both(7, 9, 2);
  both(5.3, 6.8, 3);
  both(2.5, 5, 4); both(7.2, 9.5, 4, 'crumble');
  both(0.5, 2.2, 5); both(5.3, 7, 5); both(9.8, 11.5, 5);
  both(2.5, 4.6, 6); both(7.3, 9.5, 6, 'conv', -100);       // coulées du milieu : vers les bords
  both(0.5, 2.2, 7); both(4.9, 7, 7); both(9.8, 12, 7);
  both(2.5, 4.6, 8); both(7.3, 9.5, 8);
  both(0.5, 2.2, 9, 'crumble'); both(4.9, 7, 9); both(9.8, 11.6, 9);
  both(2.5, 4.6, 10); both(7.3, 9.6, 10);
  both(4.9, 7, 11); both(10, 12.3, 11);                      // le sommet, ouvert au-dessus du grand geyser
  both(7.3, 9.5, 12, 'crumble');
  both(5, 7, 13);
  // geysers : le grand au centre (du sol au-dessus du sommet), deux le long des bords
  m.geysers = [
    { x1: 12.45 * U, x2: 13.55 * U, top: L(11.7), bot: L(0) + 4, period: 6, on: 4, phase: 0 },
    { x1: 0.02 * U, x2: 0.47 * U, top: L(10.5), bot: L(0) + 4, period: 5, on: 3, phase: 1.5 },
    { x1: 25.53 * U, x2: 25.98 * U, top: L(10.5), bot: L(0) + 4, period: 5, on: 3, phase: 4 },
  ];
  // blocs de basalte qui tombent sur le sommet
  addS(m, thwompMover({ x: 10.7 * U, y: 0.25 * U, w: 0.8 * U, h: 0.7 * U, kind: 'plat', mat: 'basaltblock', dyn: true }, L(11)));
  addS(m, thwompMover({ x: 14.5 * U, y: 0.25 * U, w: 0.8 * U, h: 0.7 * U, kind: 'plat', mat: 'basaltblock', dyn: true }, L(11)));
  m.orbPairs.push(
    { a: { x: 2 * U, y: L(1) }, b: { x: 22.45 * U, y: L(10) }, style: 'ring' },
    { a: { x: 3.55 * U, y: L(10) }, b: { x: 24 * U, y: L(1) }, style: 'ring' },
    { a: { x: 8.4 * U, y: L(8) }, b: { x: 18 * U, y: L(2) }, style: 'full' },
    { a: { x: 6 * U, y: L(13) }, b: { x: 13 * U, y: L(0) }, style: 'full' });
  m.spawns = [{ x: 2 * U, y: L(1) }, { x: 24 * U, y: L(1) }, { x: 3.55 * U, y: L(10) }, { x: 22.45 * U, y: L(10) }];
  m.paintFar = g => {};
  m.paintBack = g => {};
  m.paintFore = g => { paintSolids(g, m, mulberry32(12)); };
  m.dynBack = () => {}; m.dynFront = () => {};
  return m;
}

/* =========================================================
   DÉCORS (arrière-plans) — toujours voilés et désaturés pour que
   les plateformes, nettes et contrastées, ressortent bien.
   ========================================================= */
function texBlock(g, s, rnd) {
  const { x, y, w, h } = s;
  const gr = g.createLinearGradient(x, 0, x + w, 0); gr.addColorStop(0, '#7b6f80'); gr.addColorStop(1, '#5a5062');
  g.fillStyle = gr; g.fillRect(x, y, w, h);
  g.strokeStyle = 'rgba(30,22,36,.45)'; g.lineWidth = 1.2;
  for (let yy = y + 18; yy < y + h; yy += 26 + rnd() * 18) { g.beginPath(); g.moveTo(x, yy); for (let xx = x; xx <= x + w; xx += 12) g.lineTo(xx, yy + (rnd() - .5) * 5); g.stroke(); }
  g.fillStyle = 'rgba(120,170,90,.55)'; g.fillRect(x, y, w, 4);
  g.strokeStyle = '#231c27'; g.lineWidth = 1.6; g.strokeRect(x + .8, y + .8, w - 1.6, h - 1.6);
}
function gear(c, x, y, r, teeth, ang, col, hole) {

    g.fillStyle = '#efe0c2'; g.beginPath(); g.arc(7.6 * U, L(1.6), 22, 0, Math.PI * 2); g.fill(); g.strokeStyle = '#3a2416'; g.lineWidth = 3; g.stroke();
    g.beginPath(); g.moveTo(7.6 * U, L(1.6)); g.lineTo(7.6 * U, L(1.6) - 15); g.moveTo(7.6 * U, L(1.6)); g.lineTo(7.6 * U + 11, L(1.6) + 3); g.stroke();
    g.fillStyle = '#3a2416'; g.fillRect(7.45 * U, L(1.33), 0.3 * U, 0.3 * U); g.fillStyle = '#c9a33a'; g.fillRect(7.6 * U - 1, L(1.32), 2, 18); g.beginPath(); g.arc(7.6 * U, L(1.32) + 20, 6, 0, Math.PI * 2); g.fill();
    // fauteuil et lampe (à droite, en bas)
    g.fillStyle = '#7a3f3f'; rr(g, 14.6 * U, L(1.0), 1.1 * U, 0.75 * U, 14); g.fill(); rr(g, 14.5 * U, L(0.55), 1.3 * U, 0.4 * U, 10); g.fill();
    g.fillStyle = '#5a3a22'; g.fillRect(11.6 * U, L(1.3), 5, 1.3 * U); g.fillStyle = '#e8c86a'; g.beginPath(); g.moveTo(11.45 * U, L(1.3)); g.lineTo(11.75 * U, L(1.3)); g.lineTo(11.68 * U, L(1.6)); g.lineTo(11.52 * U, L(1.6)); g.closePath(); g.fill();
    // escalier de fond (le trait noir du croquis)

    g.lineWidth = 2; for (let i = 1; i < 10; i++) { const t = i / 10; g.beginPath(); g.moveTo(lerp(5.15, 9, t) * U, lerp(L(0), L(1.9), t)); g.lineTo(lerp(5.15, 9, t) * U, L(0)); g.stroke(); }

    fogOver(g, 'rgba(239,224,194,.42)', m);
  };

}

/* ---------------- ZONE : LE VOLCAN ---------------- */
function fracRidge(n, rough, seed) { const r = mulberry32(seed), pts = new Array(n + 1).fill(0); let step = n, amp = 1; pts[0] = r() - .5; pts[n] = r() - .5; while (step > 1) { const h = step / 2; for (let i = h; i < n; i += step) pts[i] = (pts[i - h] + pts[i + h]) / 2 + (r() - .5) * amp; amp *= rough; step = h; } return pts; }
function decorZone(m) {
  const L = m.L;
  m.paintFar = g => {
    const rnd = mulberry32(61);
    const gr = g.createLinearGradient(0, 0, 0, m.H);
    gr.addColorStop(0, '#1a0f22'); gr.addColorStop(.35, '#3d1730'); gr.addColorStop(.7, '#8a2f2a'); gr.addColorStop(1, '#d9612c');
    g.fillStyle = gr; g.fillRect(0, 0, m.W, m.H);
    // lueur du cratère
    const cx = 13 * U, cy = L(9.6);
    const gl = g.createRadialGradient(cx, cy, 10, cx, cy, 9 * U); gl.addColorStop(0, 'rgba(255,170,80,.75)'); gl.addColorStop(.2, 'rgba(255,110,50,.3)'); gl.addColorStop(1, 'rgba(255,90,40,0)');
    g.fillStyle = gl; g.fillRect(0, 0, m.W, m.H);
    // panache de fumée
    for (let i = 0; i < 70; i++) { const t = rnd(), x = cx + (rnd() - .5) * (1 + t * 9) * U * .6 + t * 3 * U, y = cy - t * 8 * U, r = (0.4 + t * 1.6) * U * (0.5 + rnd() * .5); const c = g.createRadialGradient(x, y, 0, x, y, r); c.addColorStop(0, `rgba(40,25,35,${0.35 * (1 - t * .6)})`); c.addColorStop(1, 'rgba(40,25,35,0)'); g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
    // chaînes lointaines
    const range = (base, amp, seed, col) => { const n = 256, pts = fracRidge(n, .55, seed); g.fillStyle = col; g.beginPath(); g.moveTo(0, m.H); for (let i = 0; i <= n; i++) g.lineTo(i / n * m.W, base - (pts[i] + .5) * amp); g.lineTo(m.W, m.H); g.closePath(); g.fill(); };
    range(L(4.5), 3 * U, 3, 'rgba(70,25,40,.8)');
    // le volcan
    const vol = () => { g.beginPath(); g.moveTo(3 * U, L(0)); const n = 60, pts = fracRidge(n, .5, 9);
      for (let i = 0; i <= n; i++) { const t = i / n, x = lerp(3, 23, t) * U; const peak = 1 - Math.pow(Math.abs(t - .5) * 2, 1.6); let y = L(0) - peak * 9.4 * U + pts[i] * 40; if (Math.abs(t - .5) < .07) y = Math.max(y, L(9.2) + Math.abs(t - .5) * 200); g.lineTo(x, y); }
      g.lineTo(23 * U, L(0)); g.closePath(); };
    vol(); const vg = g.createLinearGradient(0, L(9.6), 0, L(0)); vg.addColorStop(0, '#3a1a26'); vg.addColorStop(1, '#22121c'); g.fillStyle = vg; g.fill();
    g.save(); vol(); g.clip();
    // coulées de lave sur les flancs
    for (const [x0, dx, w] of [[12.6, -5.5, 14], [13.3, 4.5, 12], [12.9, -2.2, 9], [13.1, 7.5, 8]]) { g.strokeStyle = 'rgba(255,120,40,.55)'; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0 * U, L(9.2)); let x = x0 * U, y = L(9.2); for (let k = 1; k <= 14; k++) { const t = k / 14; x = (x0 + dx * t) * U + Math.sin(k * 1.7) * 20; y = lerp(L(9.2), L(0), Math.pow(t, .8)); g.lineTo(x, y); } g.stroke(); g.strokeStyle = 'rgba(255,220,120,.4)'; g.lineWidth = w * .3; g.stroke(); }
    g.restore();
    fogOver(g, 'rgba(60,20,30,.35)', m);
  };
  m.paintBack = g => {
    const rnd = mulberry32(62);
    // falaises de basalte sur les côtés (orgues), derrière les plateformes
    const cliff = (x0, x1, dir) => { for (let x = x0; x < x1; x += 22 + rnd() * 10) { const t = dir > 0 ? (x - x0) / (x1 - x0) : (x1 - x) / (x1 - x0); const h = (12.5 - t * 9 + rnd() * 1.2) * U; const w = 20 + rnd() * 10; g.fillStyle = `rgb(${38 + rnd() * 10},${26 + rnd() * 8},${36 + rnd() * 10})`; g.fillRect(x, L(0) - h, w, h); g.fillStyle = 'rgba(255,140,90,.08)'; g.fillRect(x, L(0) - h, 3, h); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x + w - 4, L(0) - h, 4, h); g.fillStyle = 'rgba(70,50,60,.9)'; g.beginPath(); g.moveTo(x, L(0) - h); g.lineTo(x + w / 2, L(0) - h - 8); g.lineTo(x + w, L(0) - h); g.closePath(); g.fill(); } };
    cliff(0, 4.2 * U, 1); cliff(21.8 * U, 26 * U, -1);
    // fissures de lave sur les falaises
    for (let i = 0; i < 16; i++) { const left = i % 2, x = (left ? rnd() * 3.6 : 22.2 + rnd() * 3.6) * U, y = L(1 + rnd() * 9); g.strokeStyle = 'rgba(255,120,50,.55)'; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 5; k++) g.lineTo(x + (rnd() - .5) * 30, y + k * 14); g.stroke(); }
    // rochers et cheminées au loin, au pied
    for (let i = 0; i < 14; i++) { const x = rnd() * m.W, w = 40 + rnd() * 80, h = 20 + rnd() * 50; g.fillStyle = 'rgba(30,18,26,.85)'; g.beginPath(); g.ellipse(x, L(0), w, h, 0, Math.PI, 0); g.fill(); }
    fogOver(g, 'rgba(60,20,30,.38)', m);
  };
  const baseFore = m.paintFore;
  m.paintFore = g => {
    baseFore(g);
    const rnd = mulberry32(63);
    // le sol : fissures incandescentes
    for (let i = 0; i < 26; i++) { const x = rnd() * m.W; g.strokeStyle = 'rgba(255,130,50,.8)'; g.lineWidth = 2; g.beginPath(); g.moveTo(x, L(0) + 6); for (let k = 0; k < 4; k++) g.lineTo(x + (k + 1) * (10 + rnd() * 12) * (rnd() < .5 ? -1 : 1), L(0) + 6 + rnd() * 30); g.stroke(); }
    // bouches des geysers (au ras du sol : rien n'y accroche)
    for (const gy of m.geysers) { const cx = (gy.x1 + gy.x2) / 2, w = gy.x2 - gy.x1; g.fillStyle = '#1d1419'; g.beginPath(); g.ellipse(cx, L(0) + 3, w / 2 + 6, 6, 0, 0, Math.PI * 2); g.fill(); g.strokeStyle = 'rgba(255,170,90,.7)'; g.lineWidth = 2; g.stroke(); }
  };
  m.dynBack = c => {
    // braises qui montent
    for (let i = 0; i < 40; i++) { const sp = 30 + (i * 37) % 40, x = ((i * 613) % 2600) + Math.sin(T * .8 + i) * 20, y = L(0) - ((T * sp + i * 97) % (14 * U)); c.fillStyle = `rgba(255,${140 + (i * 13) % 80},60,${0.5 + 0.4 * Math.sin(T * 3 + i)})`; c.fillRect(x, y, 2.5, 2.5); }
    // colonnes des geysers : vapeur quand ils soufflent, petites bouffées sinon
    for (const gy of m.geysers) {
      const on = G && G.state !== undefined ? geyserOn(gy) : false, cx = (gy.x1 + gy.x2) / 2, w = gy.x2 - gy.x1, h = gy.bot - gy.top;
      const t = ((G && G.elapsed || 0) + gy.phase) % gy.period, warn = !on && gy.period - t < 0.8;
      if (on) {
        const gr = c.createLinearGradient(0, gy.top, 0, gy.bot); gr.addColorStop(0, 'rgba(255,240,230,0)'); gr.addColorStop(.25, 'rgba(255,235,225,.16)'); gr.addColorStop(1, 'rgba(255,220,200,.3)');
        c.fillStyle = gr; c.fillRect(gy.x1, gy.top, w, h);
        for (let i = 0; i < 26; i++) { const y = gy.bot - ((T * 380 + i * h / 26) % h), k = (gy.bot - y) / h, x = cx + Math.sin(T * 4 + i * 1.7) * w * .3; c.fillStyle = `rgba(255,245,240,${0.38 * (1 - k)})`; c.beginPath(); c.arc(x, y, w * (.22 + k * .25), 0, Math.PI * 2); c.fill(); }
      } else {
        for (let i = 0; i < 5; i++) { const y = gy.bot - ((T * 60 + i * 14) % 70), k = (gy.bot - y) / 70; c.fillStyle = `rgba(255,240,230,${(warn ? .5 : .18) * (1 - k)})`; c.beginPath(); c.arc(cx + Math.sin(i + T) * 6, y, 6 + k * 10, 0, Math.PI * 2); c.fill(); }
      }
    }
  };
  return m;
}

/* =========================================================
   MODES DE JEU
   Chaque mode fournit : init, onStart, update, canMove, speed,
   canUseOrb, onCrush, chips (HUD), center (HUD), cdText, results
   ========================================================= */
const FREEZE_TAG = 1.0, IMMUNE_TAG = 1.8, WOLF_START = 1.5, WOLF_BOOST = 1.07;
const MODE_INFO = {
  loup: { name: 'Loup', desc: "Le loup chasse les autres : un contact et c'est l'autre qui devient loup. À la fin du temps, celui qui a été loup le moins longtemps gagne. Les perles téléportent ; les plantes cachent.", timed: true },
  epervier: { name: 'Épervier', desc: "Un épervier au centre, les oiseaux dans la niche de gauche. Au signal, traversez jusqu'au trou d'en face sans vous faire toucher : chaque oiseau touché devient épervier à son tour. Le dernier oiseau libre gagne.", timed: false },
  drapeau: { name: 'Drapeau', desc: "Chacun a sa zone (teintée de sa couleur). Attrapez le drapeau, volez-le en touchant celui qui le porte, et ramenez-le chez vous : 1 point par seconde tant que vous le gardez dans votre zone.", timed: true },
  zone: { name: 'Zone', desc: "Chacun pour soi sur une carte trois fois plus grande : 5 vies chacun. Foncer sur quelqu'un ou lui sauter dessus lui retire une vie. Au bout d'une minute, la zone se referme sur un point tiré au hasard : 2 s dehors = une vie en moins. Le dernier debout gagne.", timed: true },
  parcours: { name: 'Parcours', desc: "Le chat et la souris, à 2. La souris doit atteindre la perle en haut à droite (levier, trappe, pics, boules) puis rentrer : si le chat la touche avant, il gagne.", timed: false },
};
function mapIdFor(s) { return s.mode === 'loup' ? s.map : s.mode; }

function respawnAt(p, pt, frz = 0.6) { placeAt(p, pt.x, pt.y); p.frozenT = frz; p.frozenMax = Math.max(frz, 0.01); p.immuneT = 1.2; bubbleOrDust(pt.x, pt.y - 14); }
function bubbleOrDust(x, y) { if (G.map.bubbles) bubbles(x, y, 8); else burst(x, y, ['rgba(255,255,255,.8)', 'rgba(255,240,200,.8)']); }
function chipsBasic(fn) { return G.players.map(p => Object.assign({ p }, fn(p))); }

/* ---------------- LOUP ---------------- */
const ModeLoup = {
  init() {
    const m = G.map, sp = shuffle(m.spawns);
    for (let i = 0; i < settings.players; i++) G.players.push(Object.assign(newPlayer(PLAYER_DEFS[i], sp[i]), { wolfTime: 0, tags: 0 }));
    G.wolf = G.players[Math.floor(Math.random() * G.players.length)];
    G.wolfColor = G.wolf.color;
    G.time = settings.duration;
    orbsInit(rand(14, 20));
  },
  onStart() { G.wolf.frozenT = WOLF_START; G.wolf.frozenMax = WOLF_START; G.banner = { text: "C'est parti !", t: 1 }; },
  canMove: () => true,
  speed: p => p === G.wolf ? WOLF_BOOST : 1,
  canUseOrb: () => true,
  onCrush(p) { respawnAt(p, G.map.spawns[Math.floor(Math.random() * G.map.spawns.length)]); },
  update(dt) {
    G.time -= dt; G.wolf.wolfTime += dt;
    const w = G.wolf;
    if (w.frozenT <= 0 && !w.travel) for (const p of G.players) {
      if (p !== w && !p.travel && p.immuneT <= 0 && overlapP(w, p)) {
        G.wolf = p; G.wolfColor = p.color; p.frozenT = FREEZE_TAG; p.frozenMax = FREEZE_TAG; w.immuneT = IMMUNE_TAG; w.tags++;
        burst((w.x + p.x) / 2 + PW / 2, (w.y + p.y) / 2 + PH / 2, [w.color, p.color]);
        break;
      }
    }
    orbsUpdate();
    if (G.time <= 0) { G.time = 0; endGame('Temps écoulé !'); }
  },
  isWolf: p => p === G.wolf,
  cdText: () => [`Le loup : ${G.wolf.name}`, G.wolf.color],
  center: () => ({ text: fmtCeil(G.time), low: G.time <= 10 }),
  chips: () => chipsBasic(p => ({ hot: p === G.wolf, val: fmtFloor(p.wolfTime) })),
  results() {
    const arr = [...G.players].sort((a, b) => (a.wolfTime - b.wolfTime) || ((a === G.wolf) - (b === G.wolf)));
    return { winners: [arr[0]], title: `${arr[0].name} gagne !`, color: arr[0].color, sub: 'Le moins longtemps loup l’emporte',
      rows: arr.map(p => ({ p, tag: p === G.wolf ? 'LOUP À LA FIN' : '', txt: `${fmtFloor(p.wolfTime)} en loup · ${p.tags} touche${p.tags > 1 ? 's' : ''}` })) };
  },
};

/* ---------------- ÉPERVIER ---------------- */
const EP_ROUND = 30, EP_MAX_ROUNDS = 10;
const ModeEpervier = {
  init() {
    const m = G.map;
    for (let i = 0; i < settings.players; i++) G.players.push(Object.assign(newPlayer(PLAYER_DEFS[i], m.pocketSpots[0]), { hawk: false, origin: false, safe: false, leftPocket: false, caughtRound: Infinity, catches: 0 }));
    const h = G.players[Math.floor(Math.random() * G.players.length)];
    h.hawk = true; h.origin = true; h.caughtRound = 0;
    G.ep = { round: 1, dir: 1, time: settings.epRound };
    this.setupRound();
  },
  setupRound() {
    const m = G.map; let k = 0, r = 0;
    const spots = G.ep.dir > 0 ? m.pocketSpots : m.pocketSpotsR;
    for (const p of G.players) {
      p.safe = false; p.leftPocket = false; p.frozenT = 0; p.immuneT = 0;
      if (p.hawk) { placeAt(p, m.hawkSpawn.x + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 40, m.hawkSpawn.y); p.face = -G.ep.dir; k++; }
      else { const sp = spots[r++ % spots.length]; placeAt(p, sp.x, sp.y); p.face = G.ep.dir; }
    }
    G.ep.time = settings.epRound;
    orbsInit(rand(10, 14));
  },
  // portes : le côté de départ est fermé pendant le compte à rebours, puis se
  // referme derrière chaque oiseau sorti ; les éperviers n'entrent jamais.
  // Les manches alternent : gauche → droite, puis droite → gauche.
  gate(side, p) {
    if (p.hawk || !G.ep) return true;
    if (side === (G.ep.dir > 0 ? 'L' : 'R')) return G.state !== 'play' || p.leftPocket;
    return false;
  },
  onStart() { G.banner = { text: G.ep.dir > 0 ? 'Volez jusqu’au trou à droite →' : '← Volez jusqu’à la colonne de gauche', t: 1.6 }; },
  canMove: () => true,
  speed: p => p.hawk ? 1.04 : 1,
  canUseOrb: p => !p.hawk,
  onCrush(p) { respawnAt(p, p.hawk ? G.map.hawkSpawn : (G.ep.dir > 0 ? G.map.pocketSpots : G.map.pocketSpotsR)[1]); },
  update(dt) {
    const ep = G.ep;
    ep.time -= dt;
    for (const p of G.players) {
      if (p.hawk || p.safe) continue;
      const cx = p.x + PW / 2;
      if (!p.travel && (ep.dir > 0 ? cx > U + 4 : cx < 11 * U - 4)) p.leftPocket = true;
      if (p.leftPocket && !p.travel && (ep.dir > 0 ? p.x >= 11 * U + WT : p.x + PW <= U - WT)) { p.safe = true; burst(p.x + PW / 2, p.y + PH / 2, [p.color, '#fff']); G.banner = { text: `${p.name} est à l'abri !`, t: 1 }; }
    }
    for (const h of G.players) {
      if (!h.hawk || h.frozenT > 0 || h.travel) continue;
      for (const p of G.players) {
        if (p.hawk || p.safe || p.travel || !p.leftPocket || p.immuneT > 0 || !overlapP(h, p)) continue;
        p.hawk = true; p.caughtRound = ep.round; h.catches++; p.frozenT = FREEZE_TAG; p.frozenMax = FREEZE_TAG;
        burst(p.x + PW / 2, p.y + PH / 2, [h.color, p.color]);
      }
    }
    orbsUpdate();
    const runners = G.players.filter(p => !p.hawk);
    if (!runners.length) { endGame('Tous attrapés !'); return; }
    if (ep.time <= 0) {
      for (const p of runners) if (!p.safe) { p.hawk = true; p.caughtRound = ep.round; }
      G.banner = { text: 'Trop tard !', t: 1 };
      if (!G.players.some(p => !p.hawk)) { endGame('Tous attrapés !'); return; }
    }
    if (G.players.every(p => p.hawk || p.safe)) {
      if (ep.round >= EP_MAX_ROUNDS) { endGame('Ils ont tenu !'); return; }
      ep.round++; ep.dir = -ep.dir; G.orb = null;
      this.setupRound();
      G.state = 'countdown'; G.cd = 2.6;
    }
  },
  isWolf: p => p.hawk,
  cdText: () => G.ep.round === 1 ? [`L'épervier : ${G.players.find(p => p.origin).name}`, G.players.find(p => p.origin).color] : [`Manche ${G.ep.round} : départ ${G.ep.dir > 0 ? 'à gauche' : 'à droite'}`, '#fff'],
  center: () => ({ text: G.state === 'countdown' ? `Manche ${G.ep.round}` : fmtCeil(G.ep.time), low: G.state === 'play' && G.ep.time <= 8 }),
  chips: () => chipsBasic(p => ({ hot: p.hawk, val: p.hawk ? (p.origin ? `${p.catches} prise${p.catches > 1 ? 's' : ''}` : 'épervier') : (p.safe ? 'à l’abri' : 'en vol') })),
  results() {
    const free = G.players.filter(p => !p.hawk);
    const arr = [...G.players].sort((a, b) => (b.caughtRound - a.caughtRound) || (b.catches - a.catches));
    const top = arr[0];
    const title = free.length ? (free.length === 1 ? `${free[0].name} gagne !` : 'Les oiseaux ont tenu !') : (top.origin ? `${top.name} (épervier) gagne !` : `${top.name} gagne !`);
    return { winners: free.length ? free : [top], title, color: free.length > 1 ? '#fff' : top.color, sub: free.length ? `${G.ep.round} manches` : 'Dernier oiseau attrapé en premier dans le classement',
      rows: arr.map(p => ({ p, tag: p.origin ? 'ÉPERVIER' : '', txt: p.origin ? `${p.catches} prise${p.catches > 1 ? 's' : ''}` : (p.caughtRound === Infinity ? 'jamais attrapé' : `attrapé à la manche ${p.caughtRound}`) })) };
  },
};

/* ---------------- DRAPEAU ---------------- */
// zones : à 2, la verticale du milieu ; à 4, verticale + horizontale ;
// à 3, deux diagonales qui partent d'un point un peu au-dessus du centre
// vers les coins du bas (trois zones de même surface)
function zoneOf(x, y) {
  const n = settings.players, W = G.map.W, F = G.map.FLOOR;
  if (n === 2) return x < W / 2 ? 0 : 1;
  if (n === 4) return (y < F / 2 ? 0 : 2) + (x < W / 2 ? 0 : 1);
  const py = F / 3;

  loup: () => `Le <b>loup</b> porte une flèche rouge : touche un autre joueur pour lui passer le rôle. Le joueur touché est figé une seconde. Les <b>perles</b> vont par paire et te téléportent ; ${settings.map === 'epave' ? 'le <b>coffre</b> te propulse en haut de l’épave' : 'la <b>rivière</b> te propulse sur les toits'}. Le moins longtemps loup gagne.`,
  epervier: () => `L’<b>épervier</b> part du nid au centre. Les oiseaux attendent dans la colonne de gauche, qui a deux sorties (en bas, et en haut à gauche où apparaît parfois une <b>perle</b>). Il faut atteindre le <b>trou à droite</b> : là, on est à l’abri. Un oiseau touché devient épervier. Chaque manche dure 30 s : qui n’est pas arrivé est pris. Les oiseaux à l’abri repartent de la niche à la manche suivante.`,
  drapeau: () => `Chaque joueur a sa <b>zone</b>, teintée de sa couleur. Prends le <b>drapeau</b> au centre, touche celui qui le porte pour le lui voler, et garde-le chez toi : <b>1 point par seconde</b>. Attention au mur qui tombe et au carré qui tourne.`,
  zone: () => `<b>Chacun pour soi</b>, 5 vies (la barre au-dessus de chaque personnage). <b>Fonce</b> sur un adversaire ou <b>saute-lui dessus</b> : il perd une vie. Au bout de ${settings.duration >= 120 ? 'une minute' : Math.round(settings.duration / 3) + ' s'}, la <b>zone</b> se referme sur un point tiré au hasard (une croix) : <b>2 s dehors = une vie en moins</b>. Les <b>geysers</b> soufflent par intermittence et te portent vers le haut, la <b>roche ponce</b> s’effrite sous tes pieds, les <b>coulées</b> t’emportent, et des <b>blocs de basalte</b> tombent sur le sommet. Un <b>cœur</b> rend une vie.`,
  parcours: () => `La <b>souris</b> part en haut à gauche, le <b>chat</b> en bas avec 2 s de retard. La souris doit tirer le <b>levier</b> au fond du couloir : le chat est figé 3 s, la trappe entre les pics s’ouvre, le passage tout en bas du grand mur s’ouvre, et la passerelle du milieu tombe. Passe sous les pics (ou par la trappe), monte par les <b>hachures</b> (le chat passe au travers) et touche la <b>perle</b>.`,
};
let loadTimers = [];
function goPrep() {
  if (settings.mode === 'parcours') settings.players = 2;
  const wrap = $('cards'); wrap.innerHTML = '';
  const id = mapIdFor(settings), skin = MAP_BUILDERS[id]().skin;
  for (let i = 0; i < settings.players; i++) {
    const d = PLAYER_DEFS[i], card = document.createElement('div');
    card.className = 'card'; card.style.setProperty('--c', d.color);
    card.innerHTML = `<div class="nm">${d.name}</div><div class="role">${settings.mode === 'parcours' ? (i === parcoursMouse ? 'la souris' : 'le chat') : MODE_INFO[settings.mode].name}</div><canvas width="128" height="112" data-p="${i}"></canvas><div class="keys">${['left', 'jump', 'right'].map((k, j) => `<div class="kc"><div class="key" data-k="${d.keys[k]}">${d.labels[j]}</div>${['Gauche', 'Sauter', 'Droite'][j]}</div>`).join('')}</div>`;
    wrap.appendChild(card);
    const c = card.querySelector('canvas').getContext('2d');
    c.scale(2, 2); c.translate(32, 50);
    drawSkin(c, settings.mode === 'parcours' ? (i === parcoursMouse ? 'mouse' : 'cat') : skin, d.color, d.dark, 1, { sx: 1.6, sy: 1.6 });
  }
  $('prepTitle').textContent = `${settings.format === 'tournament' ? 'Tournoi · ' : ''}${MODE_INFO[settings.mode].name} · ${MAP_BUILDERS[id]().name}`;
  $('rules').innerHTML = RULES[settings.mode]();
  show('scrPrep');
  const bar = $('loadBar'), txt = $('loadTxt'), btn = $('btnStart');
  btn.disabled = true; loadTimers.forEach(clearTimeout);
  bar.style.transition = 'none'; bar.style.width = '0%'; void bar.offsetWidth;
  bar.style.transition = 'width 1.2s cubic-bezier(.4,.1,.3,1)'; bar.style.width = '100%';
  txt.textContent = 'Préparation de la carte…';
  // on prépare les couches pendant la barre de chargement
  setTimeout(() => { const m = MAP_BUILDERS[id](); layersFor(m); }, 30);
  loadTimers = [setTimeout(() => { btn.disabled = false; txt.textContent = 'Prêt ! Teste tes touches, puis Entrée'; }, 1250)];
}
$('btnNext').onclick = goPrep;
$('btnBack').onclick = () => show('scrMenu');
$('btnStart').onclick = startGame;
$('btnResume').onclick = resume;
$('btnQuit').onclick = quitToMenu;
$('btnAgain').onclick = nextOrAgain;
$('btnMenu').onclick = () => { if (TOUR && tourDecided()) quitToMenu(); else stopOrMenu(); };
$('btnPodMenu').onclick = quitToMenu;
$('btnPodAgain').onclick = () => { TOUR = null; startGame(); };
$('btnPause').onclick = () => pause();

function keyEls(k) { return document.querySelectorAll(`.key[data-k="${k.replace(/"/g, '')}"]`); }
addEventListener('keydown', e => {
  const k = e.code;
  if (k.startsWith('Arrow') || k === 'Space' || PLAYER_DEFS.some(d => Object.values(d.keys).includes(k))) e.preventDefault();
  if (e.repeat) return;
  held[k] = true;
  if (current === 'scrPrep') {
    keyEls(k).forEach(el => el.classList.add('on'));
    PLAYER_DEFS.forEach((d, i) => { if (d.keys.jump === k) { const c = document.querySelector(`#cards canvas[data-p="${i}"]`); if (c) { c.classList.remove('hop'); void c.offsetWidth; c.classList.add('hop'); } } });
    if ((k === 'Enter' || k === 'NumpadEnter') && !$('btnStart').disabled) startGame();
    else if (k === 'Escape') show('scrMenu');
    return;
  }
  if (current === 'scrMenu') { if ((k === 'Enter' || k === 'NumpadEnter')) goPrep(); return; }
  if (current === 'scrEnd') { if ((k === 'Enter' || k === 'NumpadEnter')) nextOrAgain(); else if (k === 'Escape') $('btnMenu').click(); return; }
  if (current === 'scrPodium') { if ((k === 'Enter' || k === 'NumpadEnter')) { TOUR = null; startGame(); } else if (k === 'Escape') quitToMenu(); return; }
  if (current === 'scrPause') { if (k === 'Escape' || (k === 'Enter' || k === 'NumpadEnter')) resume(); return; }
  if (G && (G.state === 'play' || G.state === 'countdown')) {
    if (k === 'Escape') { pause(); return; }
    for (const p of G.players) if (k === p.keys.jump) p.jumpBuf = BUFFER;
  }
});
addEventListener('keyup', e => { const k = e.code; held[k] = false; keyEls(k).forEach(el => el.classList.remove('on')); });
addEventListener('blur', () => { for (const k in held) held[k] = false; if (G && (G.state === 'play' || G.state === 'countdown')) pause(); });

function resize() {
  const s = Math.max(0.3, Math.min((innerWidth - 24) / VW, (innerHeight - 24) / VH));
  stage.style.transform = `scale(${s})`;
  const r = clamp(s * (devicePixelRatio || 1), 1, 1.5);
  if (Math.abs(r - RES) > 0.05) {
    RES = r; FS = Math.min(1.5, RES * Z_MAX * 1.1);
    cv.width = Math.round(VW * RES); cv.height = Math.round(VH * RES);
  }
}
addEventListener('resize', resize);
resize();
refreshMenu();
requestAnimationFrame(frame);

/* outils de test */
function sim(x, y, plan, mapId) {
  const saveG = G, saveH = { ...held };
  for (const k in held) held[k] = false;
  const m = mapId && typeof mapId === 'object' ? mapId : (saveG ? saveG.map : MAP_BUILDERS[mapId || 'epave']());
  G = { map: m, solids: m.solids, movers: [], rot: null, players: [], parts: [], state: 'play', trapOpen: !!plan.trap, mode: { canMove: () => true, speed: () => 1, onCrush() {} } };
  const p = newPlayer(PLAYER_DEFS[0], { x, y }); G.players.push(p);
  p.onGround = true; p.mvx = (plan.dir || 0) * RUN * 0.9;   // on arrive en courant
  let t = 0, air = false, res = null;
  while (t < 4) {
    const d = (plan.sw && t >= plan.sw[0]) ? plan.sw[1] : plan.dir;
    held[p.keys.left] = d < 0; held[p.keys.right] = d > 0; held[p.keys.jump] = !!plan.jump && t < 0.03;
    updatePlayer(p, STEP); t += STEP;
    for (const s of m.solids) if (s.kind === 'oneway' && p.y + PH <= s.y + 0.5 && p.x + PW > s.x && p.x < s.x + s.w) s.solidFor.add(p);
    if (!p.onGround) air = true;
    if (air && p.onGround) { res = { x: p.x + PW / 2, y: p.y + PH }; break; }
  }
  const b = p.bonks;
  for (const s of m.solids) if (s.solidFor) s.solidFor.delete(p);
  G = saveG; for (const k in held) held[k] = !!saveH[k];
  return Object.assign(res || { x: p.x + PW / 2, y: p.y + PH, timeout: true }, { bonks: b });
}
window.__ldm = { get G() { return G; }, settings, startGame, held, MAP_BUILDERS, sim, cam, step: dt => stepGame(dt), get fps() { return fpsAvg; }, MODES, consts: { JUMP_V, PW, PH } };
})();
</script>
