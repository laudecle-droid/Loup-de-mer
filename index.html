<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loup de mer</title>
<style>
:root{--ink:#04192b;--foam:#eafcff;--aqua:#5fe0e6;--panel:rgba(6,36,44,.82);--line:rgba(170,240,255,.25)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#123f45,#030f12 75%);color:var(--foam);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1000px;height:560px;flex:none}
#cv{position:absolute;inset:0;width:1000px;height:560px;border-radius:16px;box-shadow:0 0 0 4px #10343b,0 0 0 8px #071c21,0 0 0 9px #2b6f73,0 30px 80px rgba(0,0,0,.55)}
.screen{position:absolute;inset:0;border-radius:16px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,rgba(6,40,50,.62),rgba(3,20,26,.9))}
.screen.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1.title{font-size:54px;letter-spacing:5px;font-weight:900;color:#fff;text-shadow:0 3px 0 #1590ad,0 6px 0 #0a5470,0 12px 30px rgba(0,0,0,.4)}
h1.title span{display:inline-block;animation:bob 2.6s ease-in-out infinite}
h1.title small{font-size:26px;letter-spacing:2px;color:var(--aqua);margin:0 6px}
@keyframes bob{50%{transform:translateY(-6px)}}
.menuRow{display:flex;gap:16px;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 22px;display:grid;grid-template-columns:auto auto;gap:12px 18px;align-items:center;align-content:start}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:3px;color:var(--aqua);text-align:right}
.choices{display:flex;gap:7px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:none}
.choices button{min-width:60px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--foam);font-weight:700;font-size:15px;border:2px solid transparent;transition:.15s}
.choices button:hover:not(:disabled){background:rgba(255,255,255,.18)}
.choices button.sel{background:var(--aqua);color:var(--ink);border-color:#c9fbff}
.choices button:disabled{opacity:.3;cursor:default}
.desc{grid-column:1/3;font-size:12.5px;line-height:1.45;opacity:.85;max-width:420px}
.mapPick{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mapPick canvas{width:300px;height:300px;border-radius:10px;cursor:pointer;display:block}
.mapLbl{font-size:12px;opacity:.85;letter-spacing:.5px}
.big{padding:11px 32px;border-radius:999px;background:linear-gradient(180deg,#8ff3f3,#38c3d4);color:var(--ink);font-weight:900;font-size:19px;letter-spacing:1px;box-shadow:0 5px 0 #13788c,0 10px 24px rgba(0,0,0,.3);transition:.12s}
.big:hover:not(:disabled){transform:translateY(-2px)}
.big:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #13788c}
.big:disabled{filter:grayscale(.8) brightness(.7);cursor:default}
.ghost{padding:10px 22px;border-radius:999px;background:transparent;color:var(--foam);border:2px solid var(--line);font-weight:700;font-size:16px}
.ghost:hover{background:rgba(255,255,255,.08)}
.row{display:flex;gap:14px;align-items:center}
.hint{font-size:12px;opacity:.65;letter-spacing:.5px}
h2.head{font-size:32px;font-weight:900;letter-spacing:1px;text-shadow:0 4px 0 #0a5470}
.cards{display:flex;gap:12px}
.card{width:190px;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:7px}
.card .nm{font-weight:900;font-size:17px;color:var(--c)}
.card .role{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.8;margin-top:-4px}
.card canvas{width:64px;height:56px}
.card canvas.hop{animation:hop .35s ease}
@keyframes hop{40%{transform:translateY(-12px)}}
.keys{display:flex;gap:6px}
.kc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;opacity:.9;text-transform:uppercase;letter-spacing:1px}
.key{width:40px;height:40px;border-radius:9px;background:#e9f7fb;color:#0a2a40;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #86aebb;transition:transform .05s}
.key.on{transform:translateY(3px);box-shadow:0 1px 0 #86aebb;background:var(--c)}
.rules{font-size:13px;max-width:760px;text-align:center;line-height:1.45;opacity:.95}
.rules b{color:#ff8a7b}
.load{width:340px;height:9px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.load i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fe0e6,#c9fbff);border-radius:99px}
.loadtxt{font-size:12px;opacity:.8;letter-spacing:1px;margin-top:-4px}
.ranks{display:flex;flex-direction:column;gap:8px;min-width:480px}
.rk{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:9px 14px;font-size:16px}
.rk b{width:24px;font-size:20px}
.rk .n{flex:1;font-weight:800;color:var(--c)}
.rk .t{opacity:.85;font-size:14px}
.rk .tag{font-size:10.5px;background:#ff4b4b;color:#fff;border-radius:99px;padding:3px 8px;font-weight:800;letter-spacing:1px}
.pauseBtn{position:absolute;right:12px;bottom:10px;width:38px;height:38px;border-radius:50%;background:rgba(8,22,30,.7);color:#fff;font-weight:900;font-size:14px;display:none;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.35);z-index:5;letter-spacing:-1px}
.pauseBtn:hover{background:rgba(8,22,30,.9)}
.sub2{font-size:15px;opacity:.85;margin-top:-6px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>

  <div class="screen on" id="scrMenu">
    <h1 class="title" id="title"></h1>
    <div class="menuRow">
      <div class="panel">
        <h2>Mode</h2>
        <div class="choices" id="chMode"><button data-v="loup" class="sel">Loup</button><button data-v="epervier">Épervier</button><button data-v="drapeau">Drapeau</button><button data-v="parcours">Parcours</button></div>
        <h2>Joueurs</h2>
        <div class="choices" id="chPlayers"><button data-v="2" class="sel">2</button><button data-v="3">3</button><button data-v="4">4</button></div>
        <h2 id="lblTime">Durée</h2>
        <div class="choices" id="chTime"><button data-v="60">1 min</button><button data-v="120" class="sel">2 min</button><button data-v="180">3 min</button></div>
        <p class="desc" id="modeDesc"></p>
      </div>
      <div class="mapPick">
        <canvas id="mapCv" width="600" height="600"></canvas>
        <div class="mapLbl" id="mapLbl"></div>
      </div>
    </div>
    <button class="big" id="btnNext">Suivant ›</button>
  </div>

  <div class="screen" id="scrPrep">
    <h2 class="head" id="prepTitle">Préparez-vous !</h2>
    <div class="cards" id="cards"></div>
    <p class="rules" id="rules"></p>
    <div class="load"><i id="loadBar"></i></div>
    <div class="loadtxt" id="loadTxt">…</div>
    <div class="row"><button class="ghost" id="btnBack">‹ Retour</button><button class="big" id="btnStart" disabled>Lancer la partie</button></div>
  </div>

  <button class="pauseBtn" id="btnPause" title="Pause (Échap)">❚❚</button>

  <div class="screen" id="scrPause">
    <h2 class="head">Pause</h2>
    <div class="row"><button class="ghost" id="btnQuit">Menu</button><button class="big" id="btnResume">Reprendre</button></div>
    <p class="hint">Échap pour reprendre</p>
  </div>

  <div class="screen" id="scrEnd">
    <h2 class="head" id="winner">Fin !</h2>
    <p class="sub2" id="endSub"></p>
    <div class="ranks" id="ranks"></div>
    <div class="row"><button class="ghost" id="btnMenu">Menu</button><button class="big" id="btnAgain">Rejouer</button></div>
    <p class="hint">Entrée pour rejouer</p>
  </div>
</div></div>
<script>
(() => {
'use strict';

/* =========================================================
   CONSTANTES COMMUNES
   Toutes les cartes sont construites sur la même grille : 1 unité = 100 px.
   Les plateformes sont posées sur les lignes d'unité, et deux étages
   successifs sont toujours séparés d'une unité. Un saut monte de 1,35 unité.
   ========================================================= */
const VW = 1000, VH = 560;
const U = 100, LV = U;
const GRAV_UP = 2300, GRAV_DOWN = 1550, JUMP_H = 135, JUMP_V = Math.sqrt(2 * GRAV_UP * JUMP_H), GRAV = GRAV_UP;
const RUN = 250, MAX_FALL = 820;
const STEP = 1 / 120, COYOTE = 0.09, BUFFER = 0.13;
const STEP_UP = 16, SNAP_DOWN = 8, LEDGE = 14, CORNER = 11, EPS = 0.01;
const PW = 32, PH = 34;
const Z_MAX = 1.6;
const FONT = '"Trebuchet MS","Segoe UI",system-ui,sans-serif';
const PORTAL_R = 14, PEARL_TRAVEL = 0.8;
const bounceV = h => Math.sqrt(2 * GRAV_UP * h);

const PLAYER_DEFS = [
  { id: 1, name: 'Joueur 1', color: '#ff453a', dark: '#9e1a12', keys: { left: 'arrowleft', jump: 'arrowup', right: 'arrowright' }, labels: ['←', '↑', '→'] },
  { id: 2, name: 'Joueur 2', color: '#ffd60a', dark: '#93760a', keys: { left: 'q', jump: 'z', right: 'd' }, labels: ['Q', 'Z', 'D'] },
  { id: 3, name: 'Joueur 3', color: '#a46bff', dark: '#552aa8', keys: { left: 'j', jump: 'i', right: 'l' }, labels: ['J', 'I', 'L'] },
  { id: 4, name: 'Joueur 4', color: '#f4f4f4', dark: '#6f6f6f', keys: { left: 'f', jump: 't', right: 'h' }, labels: ['F', 'T', 'H'] },
];

/* ---------- outils ---------- */
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(c, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
const fmtFloor = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const fmtCeil = t => { t = Math.max(0, Math.ceil(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const slopeY = (sl, x) => sl.y1 + (x - sl.x1) * (sl.y2 - sl.y1) / (sl.x2 - sl.x1);
function poly(g, pts) { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }

/* ---------- état global ---------- */
const cv = $('cv'), ctx = cv.getContext('2d', { alpha: false }), stage = $('stage');
let RES = 0, T = 0, G = null, current = 'scrMenu';
const settings = { mode: 'loup', players: 2, duration: 120, map: 'epave' };
const held = {};
const cam = { x: 0, y: 0, z: 1 };

/* =========================================================
   PHYSIQUE
   Types de solides :
   plat (plateforme), wall (trait vertical : bloque mais on ne peut pas
   marcher dessus), bounce (tremplin), launch (propulseur horizontal),
   trap (trappe), gate (porte), oneway (hachuré : traversable par dessous)
   ========================================================= */
const hitR = (x, y, s) => x < s.x + s.w - EPS && x + PW > s.x + EPS && y < s.y + s.h - EPS && y + PH > s.y + EPS;
function blocks(p, s) {
  switch (s.kind) {
    case 'plat': case 'wall': case 'bounce': case 'launch': return true;
    case 'trap': return !G.trapOpen;
    case 'gate': return s.on(p);
    case 'oneway': return !!(s.solidFor && s.solidFor.has(p));
  }
  return false;
}
function stands(p, s) {
  switch (s.kind) {
    case 'plat': case 'bounce': case 'launch': return true;
    case 'trap': return !G.trapOpen;
    case 'oneway': return !!(s.solidFor && s.solidFor.has(p));
  }
  return false;
}
/* pentes (diagonales praticables) : bande d'épaisseur sl.t sous la ligne
   (x1,y1)-(x2,y2). On marche dessus ; par en dessous et par les côtés
   elles sont aussi solides qu'une plateforme. */
const slClamp = (sl, x) => slopeY(sl, clamp(x, sl.x1, sl.x2));
function slOver(sl, x, y) {
  const xa = Math.max(x, sl.x1), xb = Math.min(x + PW, sl.x2);
  if (xb - xa < 0.5) return null;
  const sa = slopeY(sl, xa), sb = slopeY(sl, xb);
  const lo = Math.min(sa, sb), hi = Math.max(sa, sb) + sl.t;
  return (y < hi - EPS && y + PH > lo + EPS) ? { lo, hi } : null;
}
// la pente bloque si le joueur la chevauche alors que ses pieds sont sous la surface
function slBlocks(sl, x, y) { return !!slOver(sl, x, y) && y + PH > slClamp(sl, x + PW / 2) + 2; }
/* murs obliques et carré tournant : polygones convexes (séparation des axes) */
function polyPen(verts, x, y) {
  const box = [[x, y], [x + PW, y], [x + PW, y + PH], [x, y + PH]];
  const axes = [[1, 0], [0, 1]];
  for (let i = 0; i < verts.length; i++) { const a = verts[i], b = verts[(i + 1) % verts.length], ex = b[0] - a[0], ey = b[1] - a[1], l = Math.hypot(ex, ey); axes.push([-ey / l, ex / l]); }
  let best = Infinity, bax = null;
  for (const ax of axes) {
    let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
    for (const [px, py] of box) { const d = px * ax[0] + py * ax[1]; if (d < a0) a0 = d; if (d > a1) a1 = d; }
    for (const [px, py] of verts) { const d = px * ax[0] + py * ax[1]; if (d < b0) b0 = d; if (d > b1) b1 = d; }
    const o = Math.min(a1, b1) - Math.max(a0, b0);
    if (o <= 0.01) return null;
    if (o < best) { best = o; bax = ax; }
  }
  return { d: best, ax: bax };
}
function free(p, x, y) {
  if (x < 0 || x + PW > G.map.W || y < 0) return false;
  for (const s of G.solids) if (blocks(p, s) && hitR(x, y, s)) return false;
  for (const sl of G.map.slopes) if (slBlocks(sl, x, y)) return false;
  for (const w of G.map.polys) if (polyPen(w.verts, x, y)) return false;
  return true;
}
function surfaceAt(p, up, down) {
  const feet = p.y + PH, cx = p.x + PW / 2;
  let best = null, by = Infinity;
  for (const s of G.solids) {
    if (!stands(p, s)) continue;
    if (p.x + PW > s.x + EPS && p.x < s.x + s.w - EPS && s.y >= feet - up - EPS && s.y <= feet + down + EPS && s.y < by) { by = s.y; best = { s }; }
  }
  for (const sl of G.map.slopes) {
    if (p.x + PW < sl.x1 + 1 || p.x > sl.x2 - 1) continue;
    const y = slClamp(sl, cx);
    if (y >= feet - up - EPS && y <= feet + down + EPS && y < by) { by = y; best = { sl }; }
  }
  return best ? { y: by, g: best } : null;
}
function moveX(p, dx) {
  if (!dx) return;
  const ox = p.x;
  p.x = clamp(p.x + dx, 0, G.map.W - PW);
  if (p.x === ox) return;
  for (const s of G.solids) {
    if (!blocks(p, s) || !hitR(p.x, p.y, s)) continue;
    const lift = p.y + PH - s.y;
    const vert = s.kind === 'wall' || s.kind === 'gate';
    const maxLift = vert ? -1 : (p.onGround ? STEP_UP : (p.vy > -60 ? LEDGE : -1));
    if (lift > 0 && lift <= maxLift && free(p, p.x, s.y - PH)) { p.y = s.y - PH; if (!p.onGround) { p.onGround = true; p.vy = 0; } p.ground = { s }; continue; }
    p.x = (p.x + PW / 2 < s.x + s.w / 2) ? s.x - PW : s.x + s.w;
    p.launchT = 0;
  }
  for (const sl of G.map.slopes) {
    if (!slBlocks(sl, p.x, p.y)) continue;
    const top = slClamp(sl, p.x + PW / 2), lift = p.y + PH - top;
    const maxLift = p.onGround ? STEP_UP : (p.vy >= 0 ? LEDGE : 0);
    if (lift > 0 && lift <= maxLift && free(p, p.x, top - PH)) { p.y = top - PH; p.onGround = true; p.vy = Math.max(0, p.vy); p.ground = { sl }; continue; }
    p.x = ox; p.launchT = 0; return;
  }
  for (const w of G.map.polys) if (polyPen(w.verts, p.x, p.y)) { p.x = ox; p.launchT = 0; return; }
}
function moveY(p, dy) {
  const prevTop = p.y, prevBot = p.y + PH;
  p.y += dy;
  const cx = p.x + PW / 2;
  if (dy < 0) {
    for (const s of G.solids) {
      if (!blocks(p, s) || !hitR(p.x, p.y, s)) continue;
      const ovL = (p.x + PW) - s.x, ovR = (s.x + s.w) - p.x;
      if (ovL <= CORNER && free(p, s.x - PW, p.y)) { p.x = s.x - PW; continue; }
      if (ovR <= CORNER && free(p, s.x + s.w, p.y)) { p.x = s.x + s.w; continue; }
      p.y = s.y + s.h; p.vy = 0; p.bonks++;
    }
    for (const sl of G.map.slopes) {
      const o = slOver(sl, p.x, p.y);
      if (!o || p.y + PH <= slClamp(sl, cx) + 2) continue;
      p.y = prevTop >= o.hi - 0.5 ? o.hi : prevTop; p.vy = 0; p.bonks++;
    }
    if (p.y < 0) { p.y = 0; p.vy = 0; }
  } else {
    let land = null;
    for (const s of G.solids) {
      if (!hitR(p.x, p.y, s)) continue;
      if ((s.kind === 'wall' || s.kind === 'gate') && blocks(p, s)) {
        if (prevBot <= s.y + 1) { // on ne tient pas debout sur un trait vertical : on glisse à côté
          const nx = (p.x + PW / 2 < s.x + s.w / 2) ? s.x - PW : s.x + s.w;
          if (free(p, nx, p.y)) p.x = nx; else { p.y = prevTop; p.vy = 0; }
        }
        continue;
      }
      if (stands(p, s) && prevBot <= s.y + 1 && (!land || s.y < land.y)) land = { y: s.y, g: { s } };
    }
    for (const sl of G.map.slopes) {
      if (p.x + PW < sl.x1 + 1 || p.x > sl.x2 - 1) continue;
      const y = slClamp(sl, cx);
      if (prevBot <= y + 1.5 && p.y + PH >= y && (!land || y < land.y)) land = { y, g: { sl } };
    }
    if (land) { p.y = land.y - PH; p.vy = 0; p.onGround = true; p.ground = land.g; }
    else {
      for (const s of G.solids) if (blocks(p, s) && s.kind !== 'wall' && s.kind !== 'gate' && hitR(p.x, p.y, s)) { p.y = prevTop; p.vy = 0; }
      for (const sl of G.map.slopes) if (slBlocks(sl, p.x, p.y)) { p.y = prevTop; p.vy = 0; }
    }
  }
}
function resolvePolys(p) {
  for (const w of G.map.polys) {
    const r = polyPen(w.verts, p.x, p.y); if (!r) continue;
    let [nx, ny] = r.ax; const c = polyCenter(w);
    if ((p.x + PW / 2 - c[0]) * nx + (p.y + PH / 2 - c[1]) * ny < 0) { nx = -nx; ny = -ny; }
    p.x += nx * r.d; p.y += ny * r.d;
    if (ny > 0.5 && p.vy < 0) p.vy = 0;
    if (ny < -0.5 && p.vy > 0) p.vy *= 0.5; // mur oblique : on glisse
    p.x = clamp(p.x, 0, G.map.W - PW);
  }
}
function polyCenter(w) { if (!w.c) { let x = 0, y = 0; for (const v of w.verts) { x += v[0]; y += v[1]; } w.c = [x / w.verts.length, y / w.verts.length]; } return w.c; }

/* ---------- carré tournant (séparation des axes) ---------- */
function rotVerts(R) {
  const c = Math.cos(R.ang), s = Math.sin(R.ang), h = R.half;
  R.verts = [[-h, -h], [h, -h], [h, h], [-h, h]].map(([x, y]) => [R.cx + x * c - y * s, R.cy + x * s + y * c]);
}
function resolveRot(p, R) {
  const box = [[p.x, p.y], [p.x + PW, p.y], [p.x + PW, p.y + PH], [p.x, p.y + PH]];
  const v = R.verts;
  const axes = [[1, 0], [0, 1]];

/* =========================================================

function eye(c, x, y, r, look = 1.5) { c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); c.fillStyle = '#0b1a2a'; c.beginPath(); c.arc(x + look, y, r * 0.52, 0, Math.PI * 2); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(x + look + 0.8, y - 1, r * 0.18, 0, Math.PI * 2); c.fill(); }

    c.fillStyle = dark; rr(c, -6, -4, 5, 4, 2); c.fill(); rr(c, 3, -4, 5, 4, 2); c.fill();
    rr(c, -8, -24, 18, 21, 8); c.fillStyle = col; c.fill(); c.lineWidth = 2; c.strokeStyle = dark; c.stroke();
    if (skin === 'kid' && !wolf) { c.fillStyle = dark; c.beginPath(); c.moveTo(-9, -19); c.quadraticCurveTo(1, -30, 11, -19); c.lineTo(15, -18); c.lineTo(11, -16); c.lineTo(-9, -16); c.closePath(); c.fill(); }
    if (skin === 'knight') { c.fillStyle = '#2b2b2b'; c.fillRect(-8, -20, 18, 4); c.beginPath(); c.moveTo(-8, -18); c.lineTo(-14, -15 + wg * .5); c.lineTo(-12, -20); c.closePath(); c.fill(); }
    eye(c, 4, -12, 4);
  } else if (skin === 'bird') {
    c.fillStyle = '#e8902a'; c.fillRect(-4, -3, 2, 3); c.fillRect(3, -3, 2, 3);
    c.beginPath(); c.ellipse(1, -12, 11, 11, 0, 0, Math.PI * 2); c.fillStyle = col; c.fill(); c.lineWidth = 2; c.strokeStyle = dark; c.stroke();
    c.fillStyle = dark; c.beginPath(); c.ellipse(-3, -10 + wg * .4, 6, 4, -0.4, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(4, -7, 5, 3.5, 0, 0, Math.PI * 2); c.fill();
    if (wolf) { // épervier : bec crochu, sourcils

      c.fillStyle = '#5a4636'; c.beginPath(); c.moveTo(-6, -22); c.lineTo(-1, -27); c.lineTo(2, -22); c.closePath(); c.fill();
    } else {
      c.fillStyle = '#f2a33a'; c.beginPath(); c.moveTo(11, -14); c.lineTo(16, -12); c.lineTo(11, -10); c.closePath(); c.fill();

    c.strokeStyle = '#d0782f'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(-8, -8); c.quadraticCurveTo(-16, -14 + wg, -13, -24); c.stroke();
    rr(c, -8, -20, 19, 20, 8); c.fillStyle = '#f0923f'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#8a4a17'; c.stroke();
    c.fillStyle = '#f0923f'; c.beginPath(); c.moveTo(-6, -18); c.lineTo(-4, -27); c.lineTo(1, -19); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(4, -19); c.lineTo(9, -27); c.lineTo(11, -17); c.closePath(); c.fill(); c.stroke();

    c.beginPath(); c.arc(-2, -17, 5, 0, Math.PI * 2); c.fillStyle = '#b9b4ad'; c.fill(); c.stroke();
    c.fillStyle = '#e9a7b3'; c.beginPath(); c.arc(-2, -17, 2.6, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#e07a8c'; c.beginPath(); c.arc(11, -8, 1.8, 0, Math.PI * 2); c.fill();

    c.fillStyle = '#4b5361';
    c.beginPath(); c.moveTo(-4, top + 1); c.lineTo(-1, top - 9); c.lineTo(3, top); c.closePath(); c.fill();

/* =========================================================
   CARTES — toutes construites sur la grille d'unités des croquis.
   L(k) = hauteur de l'étage k (k unités au-dessus du sol).
   Trait bleu = plateforme solide ; trait noir = décor d'arrière-plan
   (dessiné voilé, jamais solide). Hors des limites : bord noir.
   ========================================================= */
const MARGIN = 0;
const TH = 16;              // épaisseur d'une plateforme
const WT = 14;              // épaisseur d'un mur (trait vertical)
function newMap(o) {
  const m = Object.assign({ solids: [], slopes: [], polys: [], movers: [], hazards: [], hide: [], orbPairs: [], spawns: [], bubbles: false }, o);
  m.L = k => m.FLOOR - k * U;
  m.X = u => u * U;
  return m;
}
// plateforme de x1 à x2 (en unités) à l'étage k
function P(m, x1, x2, k, mat, ex = {}) { const s = Object.assign({ x: x1 * U, y: m.L(k), w: (x2 - x1) * U, h: TH, kind: 'plat', mat }, ex); m.solids.push(s); return s; }
// mur vertical : bord gauche (side 'L') ou droit ('R') posé sur x, de l'étage k1 à k2
function Wv(m, x, k1, k2, mat, side = 'L', ex = {}) { const xx = side === 'L' ? x * U : x * U - WT; const s = Object.assign({ x: xx, y: m.L(Math.max(k1, k2)), w: WT, h: Math.abs(k2 - k1) * U, kind: 'wall', mat }, ex); m.solids.push(s); return s; }
// pente entre (x1,k1) et (x2,k2)
function S(m, x1, k1, x2, k2, mat, t = TH) { if (x2 < x1) [x1, k1, x2, k2] = [x2, k2, x1, k1]; const sl = { x1: x1 * U, y1: m.L(k1), x2: x2 * U, y2: m.L(k2), mat, t }; m.slopes.push(sl); return sl; }
// mur oblique (non praticable) entre deux points, épaisseur e
function Wo(m, x1, k1, x2, k2, mat, e = 16) {
  const ax = x1 * U, ay = m.L(k1), bx = x2 * U, by = m.L(k2), l = Math.hypot(bx - ax, by - ay), nx = -(by - ay) / l * e, ny = (bx - ax) / l * e;
  const w = { verts: [[ax, ay], [bx, by], [bx + nx, by + ny], [ax + nx, ay + ny]], mat }; m.polys.push(w); return w;
}
const addS = (m, o) => { m.solids.push(o); if (o.update) m.movers.push(o); return o; };

/* ---------- palettes ---------- */
const PAL = {
  stone: { top: '#f4ece0', base: '#ddd0bd', dark: '#b3a28b', hi: 'rgba(255,255,255,.8)', line: '#4f3f52', joint: 'rgba(80,60,70,.2)', jw: 50, r: 4 },
  castle: { top: '#ece5d5', base: '#cfc4ae', dark: '#a0937b', hi: 'rgba(255,255,255,.7)', line: '#4a4236', joint: 'rgba(70,60,45,.28)', jw: 50, r: 3 },
  castlewall: { top: '#cfc4ae', base: '#b9ad95', dark: '#8f836c', hi: 'rgba(255,255,255,.3)', line: '#4a4236', joint: null, r: 2 },
  wood: { top: '#d79a5c', base: '#b0743f', dark: '#7d4c25', hi: 'rgba(255,235,200,.6)', line: '#3f2410', joint: 'rgba(60,30,10,.22)', jw: 60, r: 3 },
  shelf: { top: '#e3ae73', base: '#b97e46', dark: '#7a4b23', hi: 'rgba(255,240,210,.7)', line: '#3d220e', joint: 'rgba(60,30,10,.18)', jw: 80, r: 3 },
  wallwood: { top: '#9a6438', base: '#80512b', dark: '#5c3818', hi: 'rgba(255,220,180,.25)', line: '#2f1a08', joint: null, r: 2 },
  floorwood: { top: '#c58b55', base: '#a26c3d', dark: '#6f4521', hi: 'rgba(255,235,200,.5)', line: '#3d220e', joint: 'rgba(50,25,8,.3)', jw: 70, r: 0 },
  slab: { top: '#e2ddd4', base: '#a39c90', dark: '#6c665d', hi: 'rgba(255,255,255,.85)', line: '#26201b', joint: 'rgba(30,25,20,.35)', jw: 90, r: 1 },
  slabwall: { top: '#b5aea2', base: '#8f887d', dark: '#6c665d', hi: 'rgba(255,255,255,.35)', line: '#26201b', joint: null, r: 1 },

function slopeQuad(g, sl) { g.beginPath(); g.moveTo(sl.x1, sl.y1); g.lineTo(sl.x2, sl.y2); g.lineTo(sl.x2, sl.y2 + sl.t); g.lineTo(sl.x1, sl.y1 + sl.t); g.closePath(); }
function texPalSlope(g, sl, pal) {
  slopeQuad(g, sl); const gr = g.createLinearGradient(0, Math.min(sl.y1, sl.y2), 0, Math.max(sl.y1, sl.y2) + sl.t);
  gr.addColorStop(0, pal.top); gr.addColorStop(1, pal.dark); g.fillStyle = pal.base; g.fill();
  g.strokeStyle = pal.hi; g.lineWidth = 3; g.lineCap = 'round'; g.beginPath(); g.moveTo(sl.x1 + 2, sl.y1 + 2); g.lineTo(sl.x2 - 2, sl.y2 + 2); g.stroke();

}
function texPoly(g, w, pal) { poly(g, w.verts); g.fillStyle = pal.base; g.fill(); g.strokeStyle = pal.line; g.lineWidth = 1.6; g.stroke(); }

/* ---------- peinture générique des éléments solides fixes ---------- */
function paintSolids(g, m, rnd) {
  for (const w of m.polys) texPoly(g, w, PAL[w.mat] || PAL.stone);
  for (const sl of m.slopes) {
    if (sl.mat === 'mast' || sl.mat === 'stairs' || sl.mat === 'deck') texWoodSlope(g, sl, rnd, sl.mat);
    else if (sl.mat === 'roof') paintRoof(g, sl);
    else if (sl.mat === 'wire') { g.strokeStyle = '#1b1816'; g.lineWidth = 3.2; g.lineCap = 'round'; g.beginPath(); g.moveTo(sl.x1, sl.y1 + 1.5); g.lineTo(sl.x2, sl.y2 + 1.5); g.stroke(); }
    else texPalSlope(g, sl, PAL[sl.mat] || PAL.stone);
  }
  for (const s of m.solids) {
    if (s.dyn || s.noPaint) continue;
    switch (s.mat) {
      case 'deck': texDeck(g, s, rnd); break;
      case 'top': texDeck(g, s, rnd, { base: '#6e4c32' }); break;
      case 'rock': texRockLedge(g, s, rnd); break;
      case 'spar': texSpar(g, s.x, s.y, s.w, s.h); break;
      default:
        if (s.mat === 'slab') { g.fillStyle = 'rgba(40,25,15,.35)'; g.fillRect(s.x + 4, s.y + s.h, s.w - 4, 7); }

}
function paintRoof(g, sl) {
  g.save();

  const gr = g.createLinearGradient(0, Math.min(sl.y1, sl.y2), 0, Math.max(sl.y1, sl.y2) + sl.t); gr.addColorStop(0, '#c9a07a'); gr.addColorStop(1, '#8e5b3b');
  g.fillStyle = gr; g.fill(); g.clip();
  g.strokeStyle = 'rgba(60,30,15,.45)'; g.lineWidth = 1.4;
  for (let x = sl.x1 + 10; x < sl.x2; x += 13) { const y = slopeY(sl, x); g.beginPath(); g.arc(x, y + 2, 6.5, 0, Math.PI); g.stroke(); }
  g.restore();
  g.strokeStyle = '#4a2a17'; g.lineWidth = 1.6; slopeQuad(g, sl); g.stroke();
  g.strokeStyle = 'rgba(255,230,200,.6)'; g.lineWidth = 2; g.beginPath(); g.moveTo(sl.x1, sl.y1 + 1); g.lineTo(sl.x2, sl.y2 + 1); g.stroke();
}
function fogOver(g, col, m) { g.save(); g.globalCompositeOperation = 'source-atop'; g.fillStyle = col; g.fillRect(0, 0, m.W, m.H); g.restore(); }

/* ---------- plantes et cachettes (dessinées devant les joueurs) ---------- */
function prepHide(m) {
  const r = mulberry32(99);
  for (const z of m.hide) {
    z.rustle = 0; z.blades = [];
    const n = Math.max(6, Math.round((z.x2 - z.x1) / 8));
    for (let i = 0; i < n; i++) z.blades.push({ x: z.x1 + (i + .5) * (z.x2 - z.x1) / n + (r() - .5) * 4, h: 48 + r() * 20, w: 7 + r() * 5, ph: r() * 6, k: r() });
  }
}
function drawHide(c, m) {
  for (const z of m.hide) {
    z.rustle = Math.max(0, (z.rustle || 0) - 0.04);
    const cx = (z.x1 + z.x2) / 2, w = z.x2 - z.x1;
    if (z.type === 'weed') {
      for (const b of z.blades) {
        const sway = Math.sin(T * 1.4 + b.ph) * 6 + Math.sin(T * 9 + b.ph) * z.rustle * 5;
        c.fillStyle = ['#1f5a40', '#2a6a4c', '#173f30', '#2f7656'][Math.floor(b.k * 4)];
        c.beginPath(); c.moveTo(b.x - b.w / 2, z.y + 1); c.quadraticCurveTo(b.x - b.w / 2 + sway * .4, z.y - b.h * .55, b.x + sway, z.y - b.h); c.quadraticCurveTo(b.x + b.w / 2 + sway * .4, z.y - b.h * .55, b.x + b.w / 2, z.y + 1); c.closePath(); c.fill();
      }
    } else if (z.type === 'cactus') {
      const y = z.y, s = z.rustle * Math.sin(T * 20) * 1.5, k = w / 110;
      c.fillStyle = '#9c7650'; c.beginPath(); c.ellipse(cx, y + 1, w * 0.32, 7, 0, Math.PI, 0); c.fill();
      c.save(); c.translate(cx + s, y); c.scale(k, 1);
      c.fillStyle = '#3f8f4f'; c.strokeStyle = '#1f4f2a'; c.lineWidth = 2;
      rr(c, -16, -104, 32, 104, 15); c.fill(); c.stroke();
      rr(c, -56, -76, 20, 46, 10); c.fill(); c.stroke(); rr(c, -56, -40, 46, 16, 8); c.fill(); c.stroke();
      rr(c, 34, -90, 20, 52, 10); c.fill(); c.stroke(); rr(c, 10, -52, 44, 16, 8); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(-7, -98, 3, 92);
      c.strokeStyle = 'rgba(245,240,205,.75)'; c.lineWidth = 1; for (let i = 0; i < 16; i++) { const yy = -96 + i * 6; c.beginPath(); c.moveTo(15, yy); c.lineTo(19, yy - 2); c.moveTo(-15, yy + 3); c.lineTo(-19, yy + 1); c.stroke(); }
      c.fillStyle = '#e8708a'; c.beginPath(); c.arc(0, -106, 5, 0, Math.PI * 2); c.fill();
      c.restore();
    } else if (z.type === 'laundry') {
      c.strokeStyle = '#3a2e26'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(z.x1, z.y - 60); c.quadraticCurveTo(cx, z.y - 52, z.x2, z.y - 60); c.stroke();
      const cols = ['#e85d5d', '#f2d14b', '#5aa0e0', '#f4f4f4', '#7ac36a', '#f09a3e'];
      const n = Math.max(3, Math.round(w / 22)), ww = w / n;
      for (let i = 0; i < n; i++) { const x = z.x1 + i * ww + 2, sw = Math.sin(T * 2 + i) * 2 + z.rustle * Math.sin(T * 18 + i) * 3; c.fillStyle = cols[i % 6]; c.beginPath(); c.moveTo(x, z.y - 57); c.lineTo(x + ww - 4, z.y - 57); c.lineTo(x + ww - 4 + sw, z.y - 12); c.lineTo(x + sw, z.y - 14); c.closePath(); c.fill(); c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 1; c.stroke(); c.fillStyle = '#8a7a6a'; c.fillRect(x + 3, z.y - 60, 3, 6); }
    } else if (z.type === 'plant' || z.type === 'pot' || z.type === 'bush') {
      if (z.type !== 'bush') { c.fillStyle = '#b5552f'; c.beginPath(); c.moveTo(cx - w * .3, z.y - 20); c.lineTo(cx + w * .3, z.y - 20); c.lineTo(cx + w * .22, z.y); c.lineTo(cx - w * .22, z.y); c.closePath(); c.fill(); c.strokeStyle = '#6b2e14'; c.lineWidth = 1.5; c.stroke(); c.fillStyle = '#9c4524'; c.fillRect(cx - w * .32, z.y - 22, w * .64, 5); }
      const base = z.type === 'bush' ? z.y + 2 : z.y - 18;
      for (const b of z.blades) {
        const sway = Math.sin(T * 1.6 + b.ph) * 3 + z.rustle * Math.sin(T * 18 + b.ph) * 3;
        c.fillStyle = ['#2f7a3b', '#3e9a4a', '#25602f', '#4caf5a'][Math.floor(b.k * 4)];
        c.beginPath(); c.ellipse(b.x + sway, base - b.h * .5, 10, b.h * .48, (b.x - cx) / w * 0.9, 0, Math.PI * 2); c.fill();

}
function drawSpikes(g, h) {

/* =========================================================

function mkSchool(x, y, v, n) { return { x, y, v, fish: Array.from({ length: n }, (_, i) => ({ dx: (i % 4) * 16 + Math.random() * 8 + Math.floor(i / 4) * 9, dy: Math.floor(i / 4) * 11 + Math.random() * 6, ph: Math.random() * 6 })) }; }

let flagRGB = [235, 230, 215];

  c.beginPath(); c.moveTo(x, y);
  for (let i = 1; i <= 10; i++) { const t = i / 10; c.lineTo(x + t * w, y + t * 3 + Math.sin(T * 4 - t * 5) * 5 * t); }

/* =========================================================

   trou d'arrivée à droite.
   ========================================================= */
function mapEpervier() {
  const m = newMap({ id: 'epervier', name: 'Le Couchant', skin: 'bird', W: 12 * U, H: 8 * U, FLOOR: 7.6 * U, edge: '#000' });
  const L = m.L;
  P(m, 0, 12, 0, 'grass', { h: 0.4 * U, noPaint: true });

  P(m, 0, 1, 3, 'block', { h: 3 * U - 2 });               // socle sous la niche
  P(m, 0.5, 1, 4, 'stone'); P(m, 0, 0.5, 5, 'stone');    // marches à l'intérieur de la colonne
  P(m, 0, 1, 7.6, 'block', { h: 0.4 * U, y: 0 });         // plafond
  Wv(m, 1, 4, 6, 'block', 'R');                           // mur entre les deux sorties
  Wv(m, 1, 7, 7.6, 'block', 'R');
  addS(m, { x: U - WT, y: L(4), w: WT, h: U, kind: 'gate', mat: 'gate', dyn: true, side: 'L', on: p => ModeEpervier.gate('L', p) });
  addS(m, { x: U - WT, y: L(7), w: WT, h: U, kind: 'gate', mat: 'gate', dyn: true, side: 'L', on: p => ModeEpervier.gate('L', p) });
  // sortie du haut : plateforme en haut à gauche (perle)
  P(m, 0.5, 2.5, 6, 'stone');
  // côté droit : murs et trou d'arrivée (entre L3 et L4)
  Wv(m, 11, 4, 7.6, 'block', 'L'); Wv(m, 11, 0, 3, 'block', 'L');
  P(m, 11, 12, 3, 'block', { h: 3 * U - 2 }); P(m, 11, 12, 7.6, 'block', { h: m.L(4), y: 0 });

  P(m, 8.5, 11, 5, 'stone');

  S(m, 7.25, 1, 8.25, 2, 'stone'); P(m, 8.25, 10.75, 2, 'stone');   // la diagonale du bas s'arrête à 1 unité du sol : on passe dessous
  P(m, 9.5, 11, 1, 'stone');
  P(m, 1, 2, 2, 'stone'); P(m, 1.5, 3.5, 1, 'stone');
  P(m, 4, 6.5, 2, 'stone');
  P(m, 5.25, 7.5, 3, 'stone');                             // le nid de l'épervier
  m.orbPairs.push({ a: { x: 1.8 * U, y: L(6) }, b: { x: 10.6 * U, y: L(1) }, style: 'ring' });
  m.hawkSpawn = { x: 6.15 * U, y: L(3) };

  m.pocketSpotsR = [11.3, 11.55, 11.81].map(x => ({ x: x * U, y: L(3) }));
  m.spawns = m.pocketSpots;
  m.paintFar = g => {
    const gr = g.createLinearGradient(0, 0, 0, m.H);
    gr.addColorStop(0, '#3d3a6b'); gr.addColorStop(.45, '#c9779a'); gr.addColorStop(.8, '#f2b27a'); gr.addColorStop(1, '#f6c98c');
    g.fillStyle = gr; g.fillRect(0, 0, m.W, m.H);
    g.fillStyle = 'rgba(255,230,190,.8)'; g.beginPath(); g.arc(6 * U, 6.2 * U, 70, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#7a4f78'; g.beginPath(); g.moveTo(0, m.H); for (let x = 0; x <= m.W; x += 20) g.lineTo(x, 5.9 * U - 70 * Math.sin(x * 0.004) - 30 * Math.sin(x * 0.013 + 1)); g.lineTo(m.W, m.H); g.closePath(); g.fill();
    g.fillStyle = '#5a3a5e'; g.beginPath(); g.moveTo(0, m.H); for (let x = 0; x <= m.W; x += 20) g.lineTo(x, 6.7 * U - 40 * Math.sin(x * 0.006 + 2)); g.lineTo(m.W, m.H); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(40,25,50,.6)'; g.lineWidth = 2;
    for (const [x, y] of [[300, 160], [330, 175], [900, 120], [940, 140], [970, 128]]) { g.beginPath(); g.moveTo(x - 8, y); g.quadraticCurveTo(x - 4, y - 5, x, y); g.quadraticCurveTo(x + 4, y - 5, x + 8, y); g.stroke(); }
  };
  m.paintBack = g => {
    // arbre derrière le nid, nid de l'épervier (symbole de départ)

    g.beginPath(); g.ellipse(6.15 * U, L(3.6), 1.4 * U, 0.75 * U, 0, 0, Math.PI * 2); g.fill();
    // lumière du trou d'arrivée et de la niche
    const gr = g.createLinearGradient(11 * U, 0, 12 * U, 0); gr.addColorStop(0, 'rgba(255,240,180,.15)'); gr.addColorStop(1, 'rgba(255,240,180,.75)');
    g.fillStyle = gr; g.fillRect(11 * U, L(4), U, U);
    g.fillStyle = 'rgba(30,20,40,.5)'; g.fillRect(0, L(7), U, 4.6 * U);
    fogOver(g, 'rgba(90,60,100,.15)', m);
  };
  m.paintFore = g => {
    const rnd = mulberry32(8);
    const gg = g.createLinearGradient(0, L(0), 0, m.H); gg.addColorStop(0, '#5c8a4a'); gg.addColorStop(1, '#3d5f34');
    g.fillStyle = gg; g.fillRect(0, L(0), m.W, m.H - L(0));
    g.strokeStyle = '#2f4a28'; g.lineWidth = 1.5; for (let x = 6; x < m.W; x += 9) { g.beginPath(); g.moveTo(x, L(0) + 2); g.lineTo(x + (rnd() - .5) * 3, L(0) - 8 - rnd() * 6); g.stroke(); }
    g.fillStyle = 'rgba(255,255,255,.3)'; g.fillRect(0, L(0), m.W, 2);
    paintSolids(g, m, rnd);
    // nid
    g.strokeStyle = '#6d4a3e'; g.lineWidth = 4; g.beginPath(); g.moveTo(5.75 * U, L(3)); g.quadraticCurveTo(6.15 * U, L(3) - 40, 6.55 * U, L(3)); g.stroke();

  };
  m.dynBack = () => {}; m.dynFront = () => {};

/* =========================================================

  addS(m, oscMover({ x: 1.5 * U, y: L(8), w: 1.25 * U, h: TH, kind: 'plat', mat: 'wood', dyn: true }, 2.5 * U, 0, 6));   // plateforme mobile ↔
  P(m, 0, 3.75, 5, 'castle'); S(m, 3.75, 5, 4.05, 4.7, 'castle', 10);                                // longue plateforme + petit biseau
  P(m, 1.5, 4.75, 4, 'castle');                                                                        // plateforme du milieu gauche
  // ---------- en haut à droite ----------
  P(m, 8.25, 10.5, 8, 'castle'); S(m, 10.5, 8, 12.25, 7, 'castle');                                   // plateforme + diagonale
  P(m, 9.75, 10.75, 7, 'castle');                                                                      // petite plateforme sous la diagonale
  P(m, 8.25, 12.5, 5, 'castle');                                                                       // longue plateforme de droite
  P(m, 11.5, 14, 4, 'castle');                                                                         // reçoit le mur qui tombe
  // ---------- centre ----------
  P(m, 5.5, 8, 4, 'castle');                                                                           // plateforme du drapeau

  P(m, 0, 1, 1, 'castle');                                                                             // petite plateforme du bas

  P(m, 2.25, 4.25, 3, 'castle'); Wv(m, 4.25, 2.6, 3.5, 'castlewall', 'R');                             // longue plateforme et son poteau
  // ---------- en bas au centre et à droite ----------
  P(m, 5.25, 6.5, 2, 'castle'); S(m, 6.5, 2, 7.5, 3, 'castle');                                       // plateforme basse + diagonale (rien dessous : on passe)
  P(m, 7.5, 10.75, 3, 'castle'); Wv(m, 10.75, 1, 3, 'castlewall', 'R');
  P(m, 8, 10, 1, 'castle');
  Wv(m, 11.25, 1.3, 3, 'castlewall', 'L'); P(m, 11.25, 12.5, 3, 'castle'); P(m, 11.5, 13.25, 1, 'castle'); P(m, 12.25, 13.75, 2, 'castle');   // crochet de droite
  addS(m, { x: 4.25 * U, y: L(0) - 16, w: 0.75 * U, h: 16, kind: 'bounce', mat: 'spring', power: 3.6 * U, dyn: true });   // tremplin
  addS(m, thwompMover({ x: 12.55 * U, y: 6, w: 0.8 * U, h: 0.75 * U, kind: 'wall', mat: 'thwomp', dyn: true }, L(4)));     // mur qui tombe
  m.rot = { cx: 7 * U, cy: L(7), half: 0.8 * U, w: 0.5, ang: Math.PI / 4 };
  m.flagBase = { x: 7 * U, y: L(4) };
  m.paintFar = g => {

    g.fillStyle = gr; g.fillRect(0, 0, m.W, m.H);
  };
  m.paintBack = g => {
    g.fillStyle = '#d9d2c4'; g.fillRect(0, 0, m.W, m.H);
    g.fillStyle = '#cbc3b3';
    for (let y = 0; y < m.H; y += 34) for (let x = (y / 34) % 2 ? 0 : 34; x < m.W; x += 68) g.fillRect(x, y, 66, 32);
    // fenêtres en arc et bannières (décor)
    for (const x of [2.2, 6.0, 8.0, 11.8]) { g.fillStyle = '#7fb4dc'; g.beginPath(); g.moveTo(x * U - 26, L(0.6)); g.lineTo(x * U - 26, L(1.6)); g.arc(x * U, L(1.6), 26, Math.PI, 0); g.lineTo(x * U + 26, L(0.6)); g.closePath(); g.fill(); g.strokeStyle = '#8b8170'; g.lineWidth = 4; g.stroke(); }
    for (const x of [2.0, 12.0]) { g.fillStyle = '#8b4d4d'; g.fillRect(x * U - 30, L(8.6), 60, 1.4 * U); g.beginPath(); g.moveTo(x * U - 30, L(7.2)); g.lineTo(x * U, L(6.9)); g.lineTo(x * U + 30, L(7.2)); g.closePath(); g.fill(); g.fillStyle = '#e0b040'; g.beginPath(); g.arc(x * U, L(7.9), 12, 0, Math.PI * 2); g.fill(); }

  m.paintFore = g => { paintSolids(g, m, mulberry32(4)); };

/* =========================================================

  P(m, 2.5, 5, 2, 'shelf');                                  // buisson
  P(m, 0.25, 2.5, 4, 'shelf'); S(m, 2.5, 4, 3.5, 3, 'shelf');   // plateforme + diagonale qui descend

  addS(m, { x: 0, y: L(7), w: 0.6 * U, h: 14, kind: 'launch', mat: 'spring', vx: 1550, vy: 380, time: 0.6, dyn: true });   // propulseur

  addS(m, { x: 6.5 * U, y: L(5), w: 2.75 * U, h: TH, kind: 'trap', mat: 'bridge', dyn: true });   // passerelle : tombe quand on tire le levier

  P(m, 6.5, 9.25, 2, 'shelf');                               // couloir du levier : sol

  S(m, 5.5, 0.7, 6.25, 0, 'shelf');                          // petites diagonales du bas
  S(m, 6.75, 0, 7.75, 0.6, 'shelf');
  Wv(m, 9.37, 0, 2, 'wallwood', 'R');
  // ===== la salle des pics =====

  P(m, 8.75, 10.75, 6, 'shelf');                             // plateforme du haut (buisson, point de retour)
  Wv(m, 10.75, 6, 8, 'wallwood', 'R'); P(m, 10.75, 12.5, 8, 'shelf');   // mur + plateforme tout en haut (buisson)

  m.hazards.push({ x: 9.75 * U + 6, y: L(4) - 18, w: 1.25 * U - 6, h: 18, type: 'spikes' }, { x: 11.75 * U, y: L(4) - 18, w: 1.5 * U, h: 18, type: 'spikes' });
  P(m, 10.5, 13.5, 3, 'shelf');                              // sous la trappe
  // ===== en bas à droite =====
  P(m, 10.5, 12.25, 1, 'shelf');                             // buisson

  P(m, 14.5, 15, 1, 'shelf'); P(m, 15.25, 15.75, 2, 'shelf');
  S(m, 12.75, 0, 14, 1, 'shelf');
  // ===== la colonne de droite =====
  Wv(m, 13.5, 4, 9, 'wallwood', 'R');                        // on n'y entre que par en dessous (après la trappe)
  P(m, 14.25, 15.75, 3, 'shelf');                            // buisson
  addS(m, { x: 13.5 * U, y: L(4), w: 2.5 * U, h: TH, kind: 'oneway', mat: 'hatched', dyn: true, solidFor: new Set() });
  addS(m, { x: 13.5 * U, y: L(5), w: 2.5 * U, h: TH, kind: 'oneway', mat: 'hatched', dyn: true, solidFor: new Set() });
  P(m, 15, 15.75, 6, 'shelf');                               // buisson
  P(m, 14, 15.5, 7, 'shelf'); Wv(m, 14.25, 6.3, 7, 'wallwood', 'L');   // en haut (buisson), petit mur à côté de la perle
  addS(m, thwompMover({ x: 14.6 * U, y: 6, w: 0.8 * U, h: 0.6 * U, kind: 'wall', mat: 'weight', dyn: true }, L(7)));
  m.balls = [0, 1, 2].map(i => ({ x: 9.6 * U + i * 1.2 * U, y: L(5.5), r: 15, v: (i % 2 ? -1 : 1) * 120, col: ['#e2574c', '#4f8fd6', '#e8b93c'][i], x0: 9.2 * U, x1: 13.36 * U }));
  m.lever = { x: 9.05 * U, y: L(2), on: false };
  m.goal = { x: 13.95 * U, y: L(6) + 10 };
  m.start = { x: 1.6 * U, y: L(1) };
  m.respawn = { x: 9.3 * U, y: L(6) };
  m.catSpawn = { x: 0.7 * U, y: L(0) };
  m.hide.push(
    { x1: 0.25 * U, x2: 1.0 * U, y: L(1), type: 'bush' }, { x1: 4.0 * U, x2: 4.75 * U, y: L(2), type: 'bush' }, { x1: 3.3 * U, x2: 4.3 * U, y: L(6), type: 'bush' },
    { x1: 6.9 * U, x2: 7.6 * U, y: L(3), type: 'bush' }, { x1: 7.3 * U, x2: 7.9 * U, y: L(0), type: 'bush' }, { x1: 9.6 * U, x2: 10.3 * U, y: L(6), type: 'bush' },
    { x1: 11.3 * U, x2: 12.2 * U, y: L(8), type: 'bush' }, { x1: 10.8 * U, x2: 11.6 * U, y: L(1), type: 'bush' }, { x1: 14.7 * U, x2: 15.5 * U, y: L(0), type: 'bush' },
    { x1: 14.8 * U, x2: 15.5 * U, y: L(3), type: 'bush' }, { x1: 14.6 * U, x2: 15.4 * U, y: L(5), type: 'bush' }, { x1: 15.05 * U, x2: 15.6 * U, y: L(6), type: 'bush' }, { x1: 14.9 * U, x2: 15.4 * U, y: L(7), type: 'bush' });
  m.paintFar = g => {
    g.fillStyle = '#ecdcbc'; g.fillRect(0, 0, m.W, m.H);
    g.fillStyle = 'rgba(205,175,125,.32)'; for (let x = 0; x < m.W; x += 50) g.fillRect(x, 0, 18, m.H);
    g.fillStyle = 'rgba(150,110,70,.25)'; g.fillRect(0, L(3.6), m.W, 8);
  };
  m.paintBack = g => {
    g.fillStyle = '#3b4f78'; rr(g, 6.0 * U, L(8.4), 2.4 * U, 1.7 * U, 8); g.fill(); g.fillStyle = '#f5e7b0'; g.beginPath(); g.arc(7.8 * U, L(8), 16, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#7a5434'; g.lineWidth = 10; rr(g, 6.0 * U, L(8.4), 2.4 * U, 1.7 * U, 8); g.stroke(); g.lineWidth = 5; g.beginPath(); g.moveTo(7.2 * U, L(8.4)); g.lineTo(7.2 * U, L(6.7)); g.moveTo(6 * U, L(7.55)); g.lineTo(8.4 * U, L(7.55)); g.stroke();
    for (const [x, k, w, h] of [[1.2, 8.5, 90, 70], [3.6, 3.7, 70, 56], [12.3, 6.6, 70, 90]]) { g.fillStyle = '#9b7a55'; g.fillRect(x * U - 6, L(k) - 6, w + 12, h + 12); g.fillStyle = '#c9b78d'; g.fillRect(x * U, L(k), w, h); }
    // la rampe noire du croquis : simple décor d'escalier en fond
    g.strokeStyle = 'rgba(110,80,55,.35)'; g.lineWidth = 6; g.beginPath(); g.moveTo(5.15 * U, L(0)); g.lineTo(9.0 * U, L(1.9)); g.stroke();
    g.lineWidth = 2; for (let i = 1; i < 10; i++) { const t = i / 10; g.beginPath(); g.moveTo(lerp(5.15, 9, t) * U, lerp(L(0), L(1.9), t)); g.lineTo(lerp(5.15, 9, t) * U, L(0)); g.stroke(); }
    g.fillStyle = '#7a3f3f'; g.fillRect(11.0 * U, L(0) - 8, 3 * U, 8);
    fogOver(g, 'rgba(236,220,188,.35)', m);
  };
  m.paintFore = g => {
    paintSolids(g, m, mulberry32(6));
    for (const h of m.hazards) drawSpikes(g, h);
  };
  m.dynBack = () => {}; m.dynFront = c => drawHide(c, m);
  return m;
}

const MAP_BUILDERS = { epave: mapEpave, favelas: mapFavelas, epervier: mapEpervier, drapeau: mapDrapeau, parcours: mapParcours };

/* =========================================================
   MODES DE JEU
   Chaque mode fournit : init, onStart, update, canMove, speed,
   canUseOrb, onCrush, chips (HUD), center (HUD), cdText, results
   ========================================================= */
const FREEZE_TAG = 1.0, IMMUNE_TAG = 1.8, WOLF_START = 1.5, WOLF_BOOST = 1.07;
const MODE_INFO = {
  loup: { name: 'Loup', desc: "Le loup chasse les autres : un contact et c'est l'autre qui devient loup. À la fin du temps, celui qui a été loup le moins longtemps gagne. Les perles téléportent ; les plantes cachent.", timed: true },
  epervier: { name: 'Épervier', desc: "Un épervier au centre, les oiseaux dans la niche de gauche. Au signal, traversez jusqu'au trou d'en face sans vous faire toucher : chaque oiseau touché devient épervier à son tour. Le dernier oiseau libre gagne.", timed: false },
  drapeau: { name: 'Drapeau', desc: "Chacun a sa zone (teintée de sa couleur). Attrapez le drapeau, volez-le en touchant celui qui le porte, et ramenez-le chez vous : 1 point par seconde tant que vous le gardez dans votre zone.", timed: true },
  parcours: { name: 'Parcours', desc: "Le chat et la souris, à 2. La souris doit atteindre la perle en haut à droite (levier, trappe, pics, boules) puis rentrer : si le chat la touche avant, il gagne.", timed: false },
};
function mapIdFor(s) { return s.mode === 'loup' ? s.map : s.mode; }

function respawnAt(p, pt, frz = 0.6) { placeAt(p, pt.x, pt.y); p.frozenT = frz; p.frozenMax = Math.max(frz, 0.01); p.immuneT = 1.2; bubbleOrDust(pt.x, pt.y - 14); }
function bubbleOrDust(x, y) { if (G.map.bubbles) bubbles(x, y, 8); else burst(x, y, ['rgba(255,255,255,.8)', 'rgba(255,240,200,.8)']); }
function chipsBasic(fn) { return G.players.map(p => Object.assign({ p }, fn(p))); }

/* ---------------- LOUP ---------------- */
const ModeLoup = {
  init() {
    const m = G.map, sp = shuffle(m.spawns);
    for (let i = 0; i < settings.players; i++) G.players.push(Object.assign(newPlayer(PLAYER_DEFS[i], sp[i]), { wolfTime: 0, tags: 0 }));
    G.wolf = G.players[Math.floor(Math.random() * G.players.length)];
    G.wolfColor = G.wolf.color;
    G.time = settings.duration;
    orbsInit(rand(14, 20));
  },
  onStart() { G.wolf.frozenT = WOLF_START; G.wolf.frozenMax = WOLF_START; G.banner = { text: "C'est parti !", t: 1 }; },
  canMove: () => true,
  speed: p => p === G.wolf ? WOLF_BOOST : 1,
  canUseOrb: () => true,
  onCrush(p) { respawnAt(p, G.map.spawns[Math.floor(Math.random() * G.map.spawns.length)]); },
  update(dt) {
    G.time -= dt; G.wolf.wolfTime += dt;
    const w = G.wolf;
    if (w.frozenT <= 0 && !w.travel) for (const p of G.players) {
      if (p !== w && !p.travel && p.immuneT <= 0 && overlapP(w, p)) {
        G.wolf = p; G.wolfColor = p.color; p.frozenT = FREEZE_TAG; p.frozenMax = FREEZE_TAG; w.immuneT = IMMUNE_TAG; w.tags++;
        burst((w.x + p.x) / 2 + PW / 2, (w.y + p.y) / 2 + PH / 2, [w.color, p.color]);
        break;
      }
    }
    orbsUpdate();
    if (G.time <= 0) { G.time = 0; endGame('Temps écoulé !'); }
  },
  isWolf: p => p === G.wolf,
  cdText: () => [`Le loup : ${G.wolf.name}`, G.wolf.color],
  center: () => ({ text: fmtCeil(G.time), low: G.time <= 10 }),
  chips: () => chipsBasic(p => ({ hot: p === G.wolf, val: fmtFloor(p.wolfTime) })),
  results() {
    const arr = [...G.players].sort((a, b) => (a.wolfTime - b.wolfTime) || ((a === G.wolf) - (b === G.wolf)));
    return { title: `${arr[0].name} gagne !`, color: arr[0].color, sub: 'Le moins longtemps loup l’emporte',
      rows: arr.map(p => ({ p, tag: p === G.wolf ? 'LOUP À LA FIN' : '', txt: `${fmtFloor(p.wolfTime)} en loup · ${p.tags} touche${p.tags > 1 ? 's' : ''}` })) };
  },
};

/* ---------------- ÉPERVIER ---------------- */
const EP_ROUND = 30, EP_MAX_ROUNDS = 10;
const ModeEpervier = {
  init() {
    const m = G.map;
    for (let i = 0; i < settings.players; i++) G.players.push(Object.assign(newPlayer(PLAYER_DEFS[i], m.pocketSpots[0]), { hawk: false, origin: false, safe: false, leftPocket: false, caughtRound: Infinity, catches: 0 }));
    const h = G.players[Math.floor(Math.random() * G.players.length)];
    h.hawk = true; h.origin = true; h.caughtRound = 0;
    G.ep = { round: 1, dir: 1, time: EP_ROUND };
    this.setupRound();
  },
  setupRound() {
    const m = G.map; let k = 0, r = 0;
    const spots = G.ep.dir > 0 ? m.pocketSpots : m.pocketSpotsR;
    for (const p of G.players) {
      p.safe = false; p.leftPocket = false; p.frozenT = 0; p.immuneT = 0;
      if (p.hawk) { placeAt(p, m.hawkSpawn.x + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 40, m.hawkSpawn.y); p.face = -G.ep.dir; k++; }
      else { const sp = spots[r++ % spots.length]; placeAt(p, sp.x, sp.y); p.face = G.ep.dir; }
    }
    G.ep.time = EP_ROUND;
    orbsInit(rand(10, 14));
  },
  // portes : le côté de départ est fermé pendant le compte à rebours, puis se
  // referme derrière chaque oiseau sorti ; les éperviers n'entrent jamais.
  // Les manches alternent : gauche → droite, puis droite → gauche.
  gate(side, p) {
    if (p.hawk || !G.ep) return true;
    if (side === (G.ep.dir > 0 ? 'L' : 'R')) return G.state !== 'play' || p.leftPocket;
    return false;
  },
  onStart() { G.banner = { text: G.ep.dir > 0 ? 'Volez jusqu’au trou à droite →' : '← Volez jusqu’à la colonne de gauche', t: 1.6 }; },
  canMove: () => true,
  speed: p => p.hawk ? 1.04 : 1,
  canUseOrb: p => !p.hawk,
  onCrush(p) { respawnAt(p, p.hawk ? G.map.hawkSpawn : (G.ep.dir > 0 ? G.map.pocketSpots : G.map.pocketSpotsR)[1]); },
  update(dt) {
    const ep = G.ep;
    ep.time -= dt;
    for (const p of G.players) {
      if (p.hawk || p.safe) continue;
      const cx = p.x + PW / 2;
      if (!p.travel && (ep.dir > 0 ? cx > U + 4 : cx < 11 * U - 4)) p.leftPocket = true;
      if (p.leftPocket && !p.travel && (ep.dir > 0 ? p.x >= 11 * U + WT : p.x + PW <= U - WT)) { p.safe = true; burst(p.x + PW / 2, p.y + PH / 2, [p.color, '#fff']); G.banner = { text: `${p.name} est à l'abri !`, t: 1 }; }
    }
    for (const h of G.players) {
      if (!h.hawk || h.frozenT > 0 || h.travel) continue;
      for (const p of G.players) {
        if (p.hawk || p.safe || p.travel || !p.leftPocket || p.immuneT > 0 || !overlapP(h, p)) continue;
        p.hawk = true; p.caughtRound = ep.round; h.catches++; p.frozenT = FREEZE_TAG; p.frozenMax = FREEZE_TAG;
        burst(p.x + PW / 2, p.y + PH / 2, [h.color, p.color]);
      }
    }
    orbsUpdate();
    const runners = G.players.filter(p => !p.hawk);
    if (!runners.length) { endGame('Tous attrapés !'); return; }
    if (ep.time <= 0) {
      for (const p of runners) if (!p.safe) { p.hawk = true; p.caughtRound = ep.round; }
      G.banner = { text: 'Trop tard !', t: 1 };
      if (!G.players.some(p => !p.hawk)) { endGame('Tous attrapés !'); return; }
    }
    if (G.players.every(p => p.hawk || p.safe)) {
      if (ep.round >= EP_MAX_ROUNDS) { endGame('Ils ont tenu !'); return; }
      ep.round++; ep.dir = -ep.dir; G.orb = null;
      this.setupRound();
      G.state = 'countdown'; G.cd = 2.6;
    }
  },
  isWolf: p => p.hawk,
  cdText: () => G.ep.round === 1 ? [`L'épervier : ${G.players.find(p => p.origin).name}`, G.players.find(p => p.origin).color] : [`Manche ${G.ep.round} : départ ${G.ep.dir > 0 ? 'à gauche' : 'à droite'}`, '#fff'],
  center: () => ({ text: G.state === 'countdown' ? `Manche ${G.ep.round}` : fmtCeil(G.ep.time), low: G.state === 'play' && G.ep.time <= 8 }),
  chips: () => chipsBasic(p => ({ hot: p.hawk, val: p.hawk ? (p.origin ? `${p.catches} prise${p.catches > 1 ? 's' : ''}` : 'épervier') : (p.safe ? 'à l’abri' : 'en vol') })),
  results() {
    const free = G.players.filter(p => !p.hawk);
    const arr = [...G.players].sort((a, b) => (b.caughtRound - a.caughtRound) || (b.catches - a.catches));
    const top = arr[0];
    const title = free.length ? (free.length === 1 ? `${free[0].name} gagne !` : 'Les oiseaux ont tenu !') : (top.origin ? `${top.name} (épervier) gagne !` : `${top.name} gagne !`);
    return { title, color: free.length > 1 ? '#fff' : top.color, sub: free.length ? `${G.ep.round} manches` : 'Dernier oiseau attrapé en premier dans le classement',
      rows: arr.map(p => ({ p, tag: p.origin ? 'ÉPERVIER' : '', txt: p.origin ? `${p.catches} prise${p.catches > 1 ? 's' : ''}` : (p.caughtRound === Infinity ? 'jamais attrapé' : `attrapé à la manche ${p.caughtRound}`) })) };
  },
};

/* ---------------- DRAPEAU ---------------- */
// zones : à 2, la verticale du milieu ; à 4, verticale + horizontale ;
// à 3, deux diagonales qui partent d'un point un peu au-dessus du centre
// vers les coins du bas (trois zones de même surface)
function zoneOf(x, y) {
  const n = settings.players, W = G.map.W, F = G.map.FLOOR;
  if (n === 2) return x < W / 2 ? 0 : 1;
  if (n === 4) return (y < F / 2 ? 0 : 2) + (x < W / 2 ? 0 : 1);
  const py = F / 3;
  const ly = x < W / 2 ? lerp(F, py, x / (W / 2)) : lerp(py, F, (x - W / 2) / (W / 2));
  if (y > ly) return 2;
  return x < W / 2 ? 0 : 1;
}
function zonePolys() {
  const n = settings.players, W = G.map.W, H = G.map.H, F = G.map.FLOOR;
  if (n === 2) return [[[0, 0], [W / 2, 0], [W / 2, H], [0, H]], [[W / 2, 0], [W, 0], [W, H], [W / 2, H]]];
  if (n === 4) return [[[0, 0], [W / 2, 0], [W / 2, F / 2], [0, F / 2]], [[W / 2, 0], [W, 0], [W, F / 2], [W / 2, F / 2]], [[0, F / 2], [W / 2, F / 2], [W / 2, H], [0, H]], [[W / 2, F / 2], [W, F / 2], [W, H], [W / 2, H]]];
  const py = F / 3;
  return [[[0, 0], [W / 2, 0], [W / 2, py], [0, F]], [[W / 2, 0], [W, 0], [W, F], [W / 2, py]], [[0, F], [W / 2, py], [W, F], [W, H], [0, H]]];
}
const ModeDrapeau = {
  init() {
    const m = G.map;
    const order = shuffle([...Array(settings.players).keys()]);
    G.zonePolys = zonePolys();
    for (let i = 0; i < settings.players; i++) {
      const z = order[i], sp = this.spawnFor(z);
      G.players.push(Object.assign(newPlayer(PLAYER_DEFS[i], sp), { zone: z, spawn: sp, hold: 0 }));
    }
    G.flag = { carrier: null, x: m.flagBase.x, y: m.flagBase.y };
    G.time = settings.duration;
  },
  spawnFor(z) {
    const fb = G.map.flagBase, dummy = {};
    let best = null, bd = -1;
    for (const s of G.map.solids) {
      if (s.dyn || s.kind !== 'plat') continue;
      for (let x = s.x + 16; x <= s.x + s.w - 16; x += 16) {
        if (zoneOf(x, s.y - 14) !== z || zoneOf(x, s.y - 70) !== z || zoneOf(x - 50, s.y - 14) !== z || zoneOf(x + 50, s.y - 14) !== z || !free(dummy, x - PW / 2, s.y - PH)) continue;
        const d = Math.hypot(x - fb.x, s.y - fb.y);
        if (d > bd) { bd = d; best = { x, y: s.y }; }
      }
    }
    return best || { x: 100, y: G.map.FLOOR };
  },
  onStart() { G.banner = { text: 'Au drapeau !', t: 1 }; },
  canMove: () => true,
  speed: p => G.flag.carrier === p ? 0.95 : 1,
  canUseOrb: () => false,
  onCrush(p) { if (G.flag.carrier === p) this.drop(); respawnAt(p, p.spawn, 1); },
  drop() { const f = G.flag; f.carrier = null; f.x = G.map.flagBase.x; f.y = G.map.flagBase.y; G.banner = { text: 'Drapeau remis au centre', t: 1 }; },
  update(dt) {
    G.time -= dt;
    const f = G.flag;
    if (!f.carrier) {
      for (const p of G.players) if (!p.travel && p.frozenT <= 0 && rectTouch(p, { x: f.x - 12, y: f.y - 56, w: 30, h: 56 })) { f.carrier = p; p.immuneT = 0.8; burst(f.x, f.y - 30, [p.color, '#fff']); break; }
    } else {
      const c = f.carrier;
      if (c.immuneT <= 0) for (const p of G.players) {
        if (p === c || p.frozenT > 0 || !overlapP(p, c)) continue;
        f.carrier = p; p.immuneT = 1.0; c.frozenT = 0.6; c.frozenMax = 0.6;
        burst(p.x + PW / 2, p.y, [p.color, c.color]); break;
      }
      const h = f.carrier;
      if (zoneOf(h.x + PW / 2, h.y + PH / 2) === h.zone) { h.hold += dt; h.score = Math.floor(h.hold); }
    }
    if (G.time <= 0) { G.time = 0; endGame('Temps écoulé !'); }
  },
  isWolf: () => false,
  cdText: () => ['Ramenez le drapeau dans votre zone', '#fff'],
  center: () => ({ text: fmtCeil(G.time), low: G.time <= 10 }),
  chips: () => chipsBasic(p => ({ hot: G.flag.carrier === p, flag: true, val: `${p.score} pt${p.score > 1 ? 's' : ''}` })),
  results() {
    const arr = [...G.players].sort((a, b) => b.hold - a.hold);
    const tie = arr.length > 1 && arr[0].score === arr[1].score;
    return { title: tie ? 'Égalité !' : `${arr[0].name} gagne !`, color: tie ? '#fff' : arr[0].color, sub: '1 point par seconde de drapeau gardé chez soi',
      rows: arr.map(p => ({ p, tag: G.flag.carrier === p ? 'DRAPEAU' : '', txt: `${p.score} point${p.score > 1 ? 's' : ''}` })) };
  },
};

/* ---------------- PARCOURS ---------------- */
let parcoursMouse = Math.floor(Math.random() * 2);
const ModeParcours = {
  init() {
    const m = G.map;
    for (let i = 0; i < 2; i++) {
      const mouse = i === parcoursMouse;
      G.players.push(Object.assign(newPlayer(PLAYER_DEFS[i], mouse ? m.start : m.catSpawn), { role: mouse ? 'mouse' : 'cat' }));
    }
    G.mouse = G.players.find(p => p.role === 'mouse'); G.cat = G.players.find(p => p.role === 'cat');
    G.mouse.face = 1; G.cat.face = 1;
    G.won = null; G.goalTaken = false;
  },
  onStart() { G.cat.frozenT = 2; G.cat.frozenMax = 2; G.banner = { text: 'Cours, petite souris !', t: 1.2 }; },
  canMove: () => true,
  canUseOrb: () => false,
  onCrush(p) { respawnAt(p, G.map.respawn, 0.8); },
  speed: p => p.role === 'mouse' ? 1.1 : 1,
  update(dt) {
    const m = G.map;
    for (const b of m.balls) { b.x += b.v * dt; if (b.x < b.x0 + b.r || b.x > b.x1 - b.r) { b.v = -b.v; b.x = clamp(b.x, b.x0 + b.r, b.x1 - b.r); } }
    // les plateformes hachurées deviennent solides pour la souris une fois franchies ; le chat, lui, passe toujours au travers
    const mo0 = G.mouse;
    for (const s of G.solids) if (s.kind === 'oneway' && !s.solidFor.has(mo0) && !mo0.travel && mo0.y + PH <= s.y + 0.5 && mo0.x + PW > s.x && mo0.x < s.x + s.w) s.solidFor.add(mo0);
    for (const p of G.players) {

}

/* =========================================================
   BOUCLE
   ========================================================= */
function stepGame(dt) {
  if (G.state === 'countdown') { G.cd -= dt; if (G.cd <= 0) { G.state = 'play'; G.mode.onStart(); } }
  updateMovers(dt);
  if (G.rot) {
    const R = G.rot; R.dA = R.w * dt; R.ang += R.dA; rotVerts(R);
    for (const p of G.players) if (!p.travel && p.ground && p.ground.rot) carryRot(p, R);
  }
  for (const p of G.players) updatePlayer(p, dt);
  if (G.state === 'play') { G.elapsed += dt; G.mode.update(dt); }
}
let last = performance.now(), acc = 0, fpsAvg = 60;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  fpsAvg = fpsAvg * 0.95 + (1 / Math.max(dt, 1e-3)) * 0.05;
  T += dt;
  if (G && (G.state === 'countdown' || G.state === 'play')) {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 12) { stepGame(STEP); acc -= STEP; n++; if (G.state === 'over') break; }
    if (n >= 12) acc = 0;
  }
  if (G && G.state !== 'pause') updateFx(dt);
  if (G && G.state !== 'pause') updateCamera(dt, false);
  if (G) render(); else renderIdle();
  requestAnimationFrame(frame);
}

  epervier: () => `L’<b>épervier</b> part du nid au centre. Les oiseaux attendent dans la colonne de gauche, qui a deux sorties (en bas, et en haut à gauche où apparaît parfois une <b>perle</b>). Il faut atteindre le <b>trou à droite</b> : là, on est à l’abri. Un oiseau touché devient épervier. Chaque manche dure 30 s : qui n’est pas arrivé est pris. Les oiseaux à l’abri repartent de la niche à la manche suivante.`,
  drapeau: () => `Chaque joueur a sa <b>zone</b>, teintée de sa couleur. Prends le <b>drapeau</b> au centre, touche celui qui le porte pour le lui voler, et garde-le chez toi : <b>1 point par seconde</b>. Attention au mur qui tombe et au carré qui tourne.`,
